name: Tiwoo Browser Test

on:
  issues:
    types: [opened]

permissions:
  contents: read
  issues: write

concurrency:
  group: tiwoo-browser-${{ github.event.issue.number }}
  cancel-in-progress: false

jobs:
  browser:
    if: github.event.issue.user.login == 'ilkerbekmezcii' && startsWith(github.event.issue.title, '[TIWOO BROWSER]')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install Playwright Chromium
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/tiwoo-browser
          cd /tmp/tiwoo-browser
          npm init -y >/dev/null
          npm install --no-audit --no-fund playwright@1.55.0
          npx playwright install --with-deps chromium

      - name: Run real browser smoke and interaction test
        id: browser
        working-directory: /tmp/tiwoo-browser
        shell: bash
        run: |
          set -euo pipefail
          cat > test.mjs <<'JS'
          import { chromium } from 'playwright';
          import fs from 'node:fs';
          const browser = await chromium.launch({headless:true});
          const page = await browser.newPage({ viewport: { width: 1440, height: 1000 } });
          const consoleErrors=[]; const pageErrors=[]; const failed=[];
          page.on('console', m=>{ if(m.type()==='error') consoleErrors.push(m.text()); });
          page.on('pageerror', e=>pageErrors.push(String(e)));
          page.on('requestfailed', r=>failed.push(`${r.method()} ${r.url()} :: ${r.failure()?.errorText||'failed'}`));
          const response = await page.goto('https://tiwoo.vercel.app/', {waitUntil:'domcontentloaded', timeout:45000});
          await page.waitForTimeout(5000);
          const title=await page.title();
          const body=(await page.locator('body').innerText()).replace(/\s+/g,' ').trim();
          const buttons=await page.locator('button:visible').allTextContents();
          const links=await page.locator('a:visible').evaluateAll(xs=>xs.slice(0,30).map(a=>({text:(a.textContent||'').trim(),href:a.href})));
          const inputs=await page.locator('input:visible').evaluateAll(xs=>xs.map(i=>({type:i.type,placeholder:i.placeholder,aria:i.getAttribute('aria-label')})));
          let interaction='none';
          const candidate = page.getByRole('button', {name:/giriş|login|oturum|keşfet|explore|başla|start/i}).first();
          if(await candidate.count()){
            const before=page.url();
            await candidate.click().catch(()=>{});
            await page.waitForTimeout(1500);
            interaction=`clicked=${await candidate.innerText().catch(()=>'?')} before=${before} after=${page.url()}`;
          }
          await page.screenshot({path:'tiwoo.png',fullPage:true});
          const result={status:response?.status(),url:page.url(),title,bodyPreview:body.slice(0,1400),buttons:buttons.slice(0,40),links,inputs,interaction,consoleErrors:consoleErrors.slice(0,20),pageErrors:pageErrors.slice(0,20),failedRequests:failed.slice(0,30)};
          fs.writeFileSync('result.json',JSON.stringify(result,null,2));
          console.log(JSON.stringify(result,null,2));
          await browser.close();
          JS
          node test.mjs | tee browser.log

      - name: Report browser result
        if: always()
        uses: actions/github-script@v8
        with:
          script: |
            const fs=require('fs');
            let body='TIWOO_BROWSER_RESULT\n';
            try { body += '```json\n'+fs.readFileSync('/tmp/tiwoo-browser/result.json','utf8').slice(0,50000)+'\n```'; }
            catch(e){ body += `browser result unavailable: ${e.message}`; }
            await github.rest.issues.createComment({owner:context.repo.owner,repo:context.repo.repo,issue_number:context.issue.number,body});

      - name: Cleanup
        if: always()
        shell: bash
        run: rm -rf /tmp/tiwoo-browser
