name: Temporary Private Android Runner

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/tiwoo-android-temp.yml'
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: temporary-private-android-runner
  cancel-in-progress: true

jobs:
  test-build-publish:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Obtain ephemeral runner identity
        shell: bash
        run: |
          set -euo pipefail
          TOKEN_JSON="$(curl -fsS -H "Authorization: bearer ${ACTIONS_ID_TOKEN_REQUEST_TOKEN}" "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=tiwoo-public-runner")"
          OIDC_TOKEN="$(printf '%s' "$TOKEN_JSON" | python3 -c 'import json,sys; print(json.load(sys.stdin)["value"])')"
          echo "::add-mask::$OIDC_TOKEN"
          printf 'OIDC_TOKEN=%s\n' "$OIDC_TOKEN" >> "$GITHUB_ENV"

      - name: Fetch private source to runner temp
        shell: bash
        run: |
          set -euo pipefail
          SRC_JSON=/tmp/source.json
          SRC_DIR=/tmp/android-src
          curl -fsS --retry 3 \
            -H "Authorization: Bearer ${OIDC_TOKEN}" \
            -H 'Cache-Control: no-store' \
            'https://hiyduakdyfcpibwxrtan.supabase.co/functions/v1/tiwoo-runner-source-once' \
            -o "$SRC_JSON"
          python3 - "$SRC_JSON" "$SRC_DIR" <<'PY'
          import json, pathlib, sys
          src=pathlib.Path(sys.argv[1]); root=pathlib.Path(sys.argv[2])
          data=json.loads(src.read_text())
          assert data.get('sha')=='a2762b49903051f97bca38de72ad6833d637e14d'
          files=data.get('files') or {}
          assert len(files)>=15
          for rel,content in files.items():
              p=root/rel
              p.parent.mkdir(parents=True,exist_ok=True)
              p.write_text(content,encoding='utf-8')
          PY
          rm -f "$SRC_JSON"
          test ! -e "$GITHUB_WORKSPACE/android"
          test ! -e "$GITHUB_WORKSPACE/tiwoo"

      - name: Verify notification behavior
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          root=Path('/tmp/android-src')
          java=(root/'app/src/main/java/com/earthgames/tiwoo/MainActivity.java').read_text()
          gradle=(root/'app/build.gradle').read_text()
          assert 'setActiveConversation(String aliasesJson)' in java
          assert 'if (isActiveConversationNotification(key, type)) return;' in java
          assert '!"message".equalsIgnoreCase(type)' in java
          assert 'message:conversation:' in java
          assert 'versionCode 2' in gradle
          assert "versionName '1.0.1'" in gradle
          def blocked(aliases,key,typ):
              if typ.lower()!='message' or key is None or not aliases: return False
              n=key.strip().lower()
              if not n.startswith('message:conversation:'): return False
              return any(n.startswith('message:conversation:'+a+':') for a in aliases)
          aliases={'alice@example.com','uid:abc123','abc123'}
          assert blocked(aliases,'message:conversation:alice@example.com:100','message') is True
          assert blocked(aliases,'message:conversation:uid:abc123:101','message') is True
          assert blocked(aliases,'message:conversation:bob@example.com:102','message') is False
          assert blocked(aliases,'message:conversation:alice@example.com:103','like') is False
          print('behavior_test=PASS')
          PY

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3

      - name: Install Android SDK
        shell: bash
        run: |
          set -euo pipefail
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager 'platforms;android-36' 'build-tools;36.0.0' >/dev/null

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
          cache-disabled: true

      - name: Check Play version slot
        shell: bash
        run: |
          set -euo pipefail
          STATUS=/tmp/play-status.json
          curl -fsS --retry 3 \
            -H "Authorization: Bearer ${OIDC_TOKEN}" \
            -H 'Cache-Control: no-store' \
            'https://avpjpoywjyhnvbaqxyip.supabase.co/functions/v1/tiwoo-appdist-upload-once-20260903' \
            -o "$STATUS"
          python3 - "$STATUS" <<'PY'
          import json,sys
          d=json.load(open(sys.argv[1]))
          assert d.get('ok') is True, d
          assert int(d.get('maxVersionCode') or 0) < 2, 'versionCode 2 already used'
          print('play_preflight=PASS')
          PY
          rm -f "$STATUS"

      - name: Build release APK and AAB
        shell: bash
        run: |
          set -euo pipefail
          gradle -p /tmp/android-src clean assembleRelease bundleRelease --stacktrace
          test -s /tmp/android-src/app/build/outputs/apk/release/app-release-unsigned.apk
          test -s /tmp/android-src/app/build/outputs/bundle/release/app-release.aab
          echo 'release_build=PASS'

      - name: Sign and verify packages
        shell: bash
        run: |
          set -euo pipefail
          SIGN_JSON=/tmp/sign.json
          KS=/tmp/upload-key.jks
          curl -fsS --retry 3 \
            -H "Authorization: Bearer ${OIDC_TOKEN}" \
            -H 'Cache-Control: no-store' \
            'https://hiyduakdyfcpibwxrtan.supabase.co/functions/v1/tiwoo-runner-signing-once' \
            -o "$SIGN_JSON"
          python3 - "$SIGN_JSON" "$KS" <<'PY'
          import base64,json,sys,pathlib
          d=json.load(open(sys.argv[1]))
          pathlib.Path(sys.argv[2]).write_bytes(base64.b64decode(d['keystoreBase64']))
          for key,name in [('keyAlias','alias'),('storePassword','storepass'),('keyPassword','keypass')]:
              pathlib.Path('/tmp/'+name).write_text(str(d[key]),encoding='utf-8')
          PY
          rm -f "$SIGN_JSON"
          ALIAS="$(cat /tmp/alias)"; SP="$(cat /tmp/storepass)"; KP="$(cat /tmp/keypass)"
          AAB=/tmp/android-src/app/build/outputs/bundle/release/app-release.aab
          UAPK=/tmp/android-src/app/build/outputs/apk/release/app-release-unsigned.apk
          APK=/tmp/android-release.apk
          jarsigner -keystore "$KS" -storepass "$SP" -keypass "$KP" -sigalg SHA256withRSA -digestalg SHA-256 "$AAB" "$ALIAS" >/dev/null
          "${ANDROID_HOME}/build-tools/36.0.0/apksigner" sign --ks "$KS" --ks-key-alias "$ALIAS" --ks-pass "pass:$SP" --key-pass "pass:$KP" --out "$APK" "$UAPK" >/dev/null
          jarsigner -verify "$AAB" >/dev/null
          "${ANDROID_HOME}/build-tools/36.0.0/apksigner" verify "$APK" >/dev/null
          test -s "$AAB" && test -s "$APK"
          echo 'package_signing=PASS'
          unset ALIAS SP KP
          rm -f /tmp/alias /tmp/storepass /tmp/keypass "$KS"

      - name: Publish bundle to internal testing
        shell: bash
        run: |
          set -euo pipefail
          AAB=/tmp/android-src/app/build/outputs/bundle/release/app-release.aab
          RESULT=/tmp/publish.json
          curl -fsS --retry 2 -X POST \
            -H "Authorization: Bearer ${OIDC_TOKEN}" \
            -H 'Cache-Control: no-store' \
            -H 'Content-Type: application/octet-stream' \
            -H 'x-version-name: 1.0.1' \
            --data-binary "@$AAB" \
            'https://avpjpoywjyhnvbaqxyip.supabase.co/functions/v1/tiwoo-appdist-upload-once-20260903' \
            -o "$RESULT"
          python3 - "$RESULT" <<'PY'
          import json,sys
          d=json.load(open(sys.argv[1]))
          assert d.get('ok') is True, d
          assert d.get('stage')=='committed', d
          assert d.get('track')=='internal', d
          assert int(d.get('versionCode') or 0)==2, d
          print('play_internal_publish=PASS versionCode=2')
          PY
          rm -f "$RESULT"

      - name: Verify internal testing release
        shell: bash
        run: |
          set -euo pipefail
          STATUS=/tmp/play-status.json
          curl -fsS --retry 3 \
            -H "Authorization: Bearer ${OIDC_TOKEN}" \
            -H 'Cache-Control: no-store' \
            'https://avpjpoywjyhnvbaqxyip.supabase.co/functions/v1/tiwoo-appdist-upload-once-20260903' \
            -o "$STATUS"
          python3 - "$STATUS" <<'PY'
          import json,sys
          d=json.load(open(sys.argv[1]))
          assert d.get('ok') is True, d
          internal=d.get('internal') or {}
          releases=internal.get('releases') or []
          assert any('2' in [str(v) for v in (r.get('versionCodes') or [])] for r in releases), d
          print('play_internal_verify=PASS')
          PY
          rm -f "$STATUS"

      - name: Cleanup ephemeral data
        if: always()
        shell: bash
        run: |
          rm -rf /tmp/android-src /tmp/source.json /tmp/sign.json /tmp/upload-key.jks /tmp/android-release.apk /tmp/alias /tmp/storepass /tmp/keypass /tmp/play-status.json /tmp/publish.json
          rm -rf "$HOME/.gradle/caches" "$HOME/.gradle/daemon" "$HOME/.gradle/notifications" || true
