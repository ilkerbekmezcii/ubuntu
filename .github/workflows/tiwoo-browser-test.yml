name: Tiwoo Browser Test

on:
  issues:
    types: [opened]

permissions:
  contents: read
  issues: write

concurrency:
  group: tiwoo-browser-${{ github.event.issue.number }}
  cancel-in-progress: false

jobs:
  browser:
    if: github.event.issue.user.login == 'ilkerbekmezcii' && startsWith(github.event.issue.title, '[TIWOO BROWSER]')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install Playwright Chromium
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/tiwoo-browser
          cd /tmp/tiwoo-browser
          npm init -y >/dev/null
          npm install --no-audit --no-fund playwright@1.55.0
          npx playwright install --with-deps chromium

      - name: Run real browser journeys
        working-directory: /tmp/tiwoo-browser
        shell: bash
        run: |
          set -euo pipefail
          cat > test.mjs <<'JS'
          import { chromium } from 'playwright';
          import fs from 'node:fs';
          const result={pages:[],desktop:{},mobile:{},consoleErrors:[],pageErrors:[],failedRequests:[],probeErrors:[]};
          const browser=await chromium.launch({headless:true});
          const wire=(page,label)=>{
            page.setDefaultTimeout(5000);
            page.on('console',m=>{if(m.type()==='error')result.consoleErrors.push(`${label}: ${m.text()}`)});
            page.on('pageerror',e=>result.pageErrors.push(`${label}: ${String(e)}`));
            page.on('requestfailed',r=>result.failedRequests.push(`${label}: ${r.method()} ${r.url()} :: ${r.failure()?.errorText||'failed'}`));
          };
          try{
            const page=await browser.newPage({viewport:{width:1440,height:1000}}); wire(page,'desktop');
            for(const path of ['/','/hakkinda','/ozellikler','/privacy']){
              try{const r=await page.goto('https://tiwoo.vercel.app'+path,{waitUntil:'domcontentloaded',timeout:20000});await page.waitForTimeout(700);result.pages.push({path,status:r?.status(),title:await page.title(),url:page.url(),h1:await page.locator('h1').first().innerText().catch(()=>null)});}catch(e){result.probeErrors.push(`page ${path}: ${e.message}`)}
            }
            await page.goto('https://tiwoo.vercel.app/',{waitUntil:'domcontentloaded',timeout:20000}); await page.waitForTimeout(2500);
            try{
              await page.locator('#publicLogin').click(); await page.waitForTimeout(400);
              result.desktop.loginModal={visible:await page.locator('#authModal').isVisible(),title:await page.locator('#authTitle').innerText().catch(()=>null),lead:await page.locator('#authLead').innerText().catch(()=>null),visibleInputs:await page.locator('#authModal input:visible').evaluateAll(xs=>xs.map(x=>({id:x.id,type:x.type,placeholder:x.placeholder,aria:x.getAttribute('aria-label')}))),forgotVisible:await page.locator('#shellForgot').isVisible().catch(()=>false),googleHostVisible:await page.locator('#tiwooGoogleChoiceHost').isVisible().catch(()=>false)};
              if(result.desktop.loginModal.forgotVisible){await page.locator('#shellForgot').click();await page.waitForTimeout(350);result.desktop.forgot={visible:await page.locator('#forgotModal').isVisible().catch(()=>false),authStillVisible:await page.locator('#authModal').isVisible().catch(()=>false),emailVisible:await page.locator('#forgotEmail').isVisible().catch(()=>false)};}
            }catch(e){result.probeErrors.push(`desktop auth: ${e.message}`)}
            const mobile=await browser.newPage({viewport:{width:390,height:844},isMobile:true}); wire(mobile,'mobile');
            const mr=await mobile.goto('https://tiwoo.vercel.app/',{waitUntil:'domcontentloaded',timeout:20000}); await mobile.waitForTimeout(2500);
            const mobileLoginCandidates=await mobile.locator('#publicLogin,#publicLoginHero').evaluateAll(xs=>xs.map(x=>({id:x.id,visible:!!(x.offsetWidth||x.offsetHeight||x.getClientRects().length)})));
            result.mobile.home={status:mr?.status(),scrollWidth:await mobile.evaluate(()=>document.documentElement.scrollWidth),clientWidth:await mobile.evaluate(()=>document.documentElement.clientWidth),loginCandidates:mobileLoginCandidates};
            try{
              const visible=mobile.locator('#publicLogin:visible,#publicLoginHero:visible').first();
              if(await visible.count()){result.mobile.clicked=await visible.getAttribute('id');await visible.click();await mobile.waitForTimeout(400);result.mobile.loginModal={visible:await mobile.locator('#authModal').isVisible().catch(()=>false),box:await mobile.locator('#authModal .modal-card').boundingBox().catch(()=>null),scrollWidth:await mobile.evaluate(()=>document.documentElement.scrollWidth),clientWidth:await mobile.evaluate(()=>document.documentElement.clientWidth)};} else result.probeErrors.push('mobile auth: no visible login control');
            }catch(e){result.probeErrors.push(`mobile auth: ${e.message}`)}
          } finally {
            result.consoleErrors=result.consoleErrors.slice(0,30);result.pageErrors=result.pageErrors.slice(0,30);result.failedRequests=result.failedRequests.slice(0,40);
            fs.writeFileSync('result.json',JSON.stringify(result,null,2));console.log(JSON.stringify(result,null,2));await browser.close();
          }
          JS
          node test.mjs | tee browser.log

      - name: Report browser result
        if: always()
        uses: actions/github-script@v8
        with:
          script: |
            const fs=require('fs');
            let body='TIWOO_BROWSER_RESULT\n';
            try { body += '```json\n'+fs.readFileSync('/tmp/tiwoo-browser/result.json','utf8').slice(0,50000)+'\n```'; }
            catch(e){ body += `browser result unavailable: ${e.message}`; }
            await github.rest.issues.createComment({owner:context.repo.owner,repo:context.repo.repo,issue_number:context.issue.number,body});

      - name: Cleanup
        if: always()
        shell: bash
        run: rm -rf /tmp/tiwoo-browser
