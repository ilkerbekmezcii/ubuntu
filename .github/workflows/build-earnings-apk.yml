name: Build Microsoft Earnings APK

on:
  push:
    branches: [work]
    paths:
      - 'android-earnings/**'
      - '.github/workflows/build-earnings-apk.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Install Android SDK packages
        shell: bash
        run: |
          set -euo pipefail
          SDKMANAGER=$(find "${ANDROID_HOME:-/usr/local/lib/android/sdk}" -type f -name sdkmanager -perm -111 2>/dev/null | head -n1)
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" 'platforms;android-35' 'build-tools;35.0.0' >/dev/null

      - name: Build APK
        working-directory: android-earnings
        shell: bash
        run: |
          set -euo pipefail
          gradle --no-daemon clean assembleDebug
          cp app/build/outputs/apk/debug/app-debug.apk ../Microsoft-Earnings-v1.2-debug.apk
          sha256sum ../Microsoft-Earnings-v1.2-debug.apk
          unzip -t ../Microsoft-Earnings-v1.2-debug.apk >/dev/null

      - uses: actions/upload-artifact@v4
        with:
          name: Microsoft-Earnings-v1.2-APK
          path: Microsoft-Earnings-v1.2-debug.apk
          if-no-files-found: error
          retention-days: 7
