name: Partner Center Entra Setup via Ubuntu

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/partner-center-earnings-live.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  setup:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      PARTNER_CENTER_CLIENT_ID: ${{ secrets.PARTNER_CENTER_CLIENT_ID }}
      PARTNER_CENTER_TENANT_ID: ${{ secrets.PARTNER_CENTER_TENANT_ID }}
      DEV_CENTER_APP_ID: 4990cffe-04e8-4e8b-808a-1175604b879f
      GRAPH_APP_ID: 00000003-0000-0000-c000-000000000000
      GRAPH_USER_READ_SCOPE_ID: e1fe6dd8-ba31-4d61-89e7-88639da4683d
    steps:
      - name: Sign in interactively with device code
        shell: bash
        run: |
          set -euo pipefail
          az login --tenant "$PARTNER_CENTER_TENANT_ID" --use-device-code --allow-no-subscriptions

      - name: Ensure Microsoft Dev Center service principal exists
        shell: bash
        run: |
          set -euo pipefail
          az ad sp show --id "$DEV_CENTER_APP_ID" >/tmp/devcenter-sp.json 2>/dev/null || az ad sp create --id "$DEV_CENTER_APP_ID" >/tmp/devcenter-sp.json
          jq '{appId,displayName,id}' /tmp/devcenter-sp.json

      - name: Add delegated permissions to Partner Center app
        shell: bash
        run: |
          set -euo pipefail
          DEV_SCOPE_ID=$(az ad sp show --id "$DEV_CENTER_APP_ID" --query "oauth2PermissionScopes[?value=='user_impersonation'].id | [0]" -o tsv)
          test -n "$DEV_SCOPE_ID"
          az ad app permission add --id "$PARTNER_CENTER_CLIENT_ID" --api "$DEV_CENTER_APP_ID" --api-permissions "${DEV_SCOPE_ID}=Scope"
          az ad app permission add --id "$PARTNER_CENTER_CLIENT_ID" --api "$GRAPH_APP_ID" --api-permissions "${GRAPH_USER_READ_SCOPE_ID}=Scope" || true
          echo "delegated_permissions_added"

      - name: Grant admin consent
        shell: bash
        run: |
          set -euo pipefail
          az ad app permission admin-consent --id "$PARTNER_CENTER_CLIENT_ID"
          echo "admin_consent_done"

      - name: Verify permissions
        shell: bash
        run: |
          set -euo pipefail
          az ad app permission list --id "$PARTNER_CENTER_CLIENT_ID" -o json | jq '[.[] | {resourceAppId,resourceAccess}]'
