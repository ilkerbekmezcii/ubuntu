name: Partner Center Graph Permission Setup

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/partner-center-earnings-live.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  setup:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      PARTNER_CENTER_CLIENT_ID: ${{ secrets.PARTNER_CENTER_CLIENT_ID }}
      PARTNER_CENTER_CLIENT_SECRET: ${{ secrets.PARTNER_CENTER_CLIENT_SECRET }}
      PARTNER_CENTER_TENANT_ID: ${{ secrets.PARTNER_CENTER_TENANT_ID }}
    steps:
      - name: Diagnose Microsoft Graph permissions
        shell: bash
        run: |
          set -euo pipefail
          BODY=$(mktemp)
          CODE=$(curl -sS -o "$BODY" -w '%{http_code}' \
            -X POST "https://login.microsoftonline.com/${PARTNER_CENTER_TENANT_ID}/oauth2/v2.0/token" \
            -H 'Content-Type: application/x-www-form-urlencoded' \
            --data-urlencode 'grant_type=client_credentials' \
            --data-urlencode "client_id=${PARTNER_CENTER_CLIENT_ID}" \
            --data-urlencode "client_secret=${PARTNER_CENTER_CLIENT_SECRET}" \
            --data-urlencode 'scope=https://graph.microsoft.com/.default')
          echo "graph_oauth_http_status=$CODE"
          test "$CODE" = "200"
          TOKEN=$(jq -r '.access_token' "$BODY")
          echo "::add-mask::$TOKEN"
          PAYLOAD=$(printf '%s' "$TOKEN" | cut -d. -f2 | tr '_-' '/+' | awk '{l=length($0)%4;if(l==2)$0=$0"==";else if(l==3)$0=$0"=";print}' | base64 -d 2>/dev/null || true)
          echo "graph_token_roles=$(printf '%s' "$PAYLOAD" | jq -c '.roles // []')"

          APPRESP=$(mktemp)
          APPCODE=$(curl -sS -o "$APPRESP" -w '%{http_code}' \
            -H "Authorization: Bearer $TOKEN" \
            "https://graph.microsoft.com/v1.0/applications?%24filter=appId%20eq%20'${PARTNER_CENTER_CLIENT_ID}'&%24select=id,appId,displayName,requiredResourceAccess")
          echo "graph_get_application_status=$APPCODE"
          if [ "$APPCODE" = "200" ]; then
            jq '{value:[.value[]|{id,appId,displayName,requiredResourceAccess}]}' "$APPRESP"
          else
            jq -c '{error:.error.code,message:.error.message}' "$APPRESP" 2>/dev/null || cat "$APPRESP"
          fi

          SPRESP=$(mktemp)
          SPCODE=$(curl -sS -o "$SPRESP" -w '%{http_code}' \
            -H "Authorization: Bearer $TOKEN" \
            "https://graph.microsoft.com/v1.0/servicePrincipals?%24filter=appId%20eq%20'4990cffe-04e8-4e8b-808a-1175604b879f'&%24select=id,appId,displayName,oauth2PermissionScopes")
          echo "graph_get_devcenter_sp_status=$SPCODE"
          if [ "$SPCODE" = "200" ]; then
            jq '{value:[.value[]|{id,appId,displayName,oauth2PermissionScopes:[.oauth2PermissionScopes[]|select(.value=="user_impersonation")|{id,value,type,isEnabled}]}]}' "$SPRESP"
          else
            jq -c '{error:.error.code,message:.error.message}' "$SPRESP" 2>/dev/null || cat "$SPRESP"
          fi
