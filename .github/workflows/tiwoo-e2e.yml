name: Tiwoo Live E2E Audit

on:
  push:
    branches: [tiwoo-e2e]
    paths:
      - 'tiwoo-e2e.mjs'
      - '.github/workflows/tiwoo-e2e.yml'
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: tiwoo-live-e2e
  cancel-in-progress: true

jobs:
  build-private-work:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Obtain temporary private-repo credential
        shell: bash
        env:
          BROKER_URL: https://avpjpoywjyhnvbaqxyip.supabase.co/functions/v1/tiwoo-admin-upgrade-probe
          OIDC_AUDIENCE: tiwoo-private-build-20260910
        run: |
          set -euo pipefail
          OIDC="$(curl -fsS -H "Authorization: bearer ${ACTIONS_ID_TOKEN_REQUEST_TOKEN}" "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=${OIDC_AUDIENCE}" | python3 -c 'import json,sys; print(json.load(sys.stdin)["value"])')"
          RESPONSE="$(curl -fsS -X POST -H "Authorization: Bearer ${OIDC}" -H 'content-type: application/json' -d '{}' "${BROKER_URL}")"
          TOKEN="$(printf '%s' "$RESPONSE" | python3 -c 'import json,sys; d=json.load(sys.stdin); assert d.get("ok") is True and d.get("token"); print(d["token"])')"
          echo "::add-mask::$TOKEN"
          printf 'TIWOO_REPO_TOKEN=%s\n' "$TOKEN" >> "$GITHUB_ENV"

      - name: Clone private Tiwoo work branch into ephemeral runner
        shell: bash
        run: |
          set -euo pipefail
          AUTH="$(printf 'x-access-token:%s' "$TIWOO_REPO_TOKEN" | base64 -w0)"
          git -c http.extraheader="AUTHORIZATION: basic ${AUTH}" clone --quiet --depth 1 --branch work https://github.com/ilkerbekmezcii/tiwoo.git tiwoo-work
          git -C tiwoo-work remote remove origin
          echo "private_checkout_sha=$(git -C tiwoo-work rev-parse HEAD)"
          unset TIWOO_REPO_TOKEN AUTH

      - name: Set up Node 24
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Run full Tiwoo build gates
        shell: bash
        working-directory: tiwoo-work
        run: |
          set -euo pipefail
          if [ -d .github ]; then mv .github "$RUNNER_TEMP/tiwoo-private-github-metadata"; fi
          npm install --no-package-lock --no-audit --no-fund
          npm run build

  audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      TIWOO_TEST_USERNAME: ${{ secrets.TIWOO_TEST_USERNAME }}
      TIWOO_TEST_PASSWORD: ${{ secrets.TIWOO_TEST_PASSWORD }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Playwright Chromium
        shell: bash
        run: |
          set -euo pipefail
          npm init -y >/dev/null 2>&1
          npm install --no-save playwright@1.55.0 >/dev/null
          npx playwright install --with-deps chromium >/dev/null

      - name: Audit live Tiwoo
        shell: bash
        run: node tiwoo-e2e.mjs

      - name: Upload public audit evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tiwoo-live-audit
          path: artifacts/
          if-no-files-found: warn
          retention-days: 1
