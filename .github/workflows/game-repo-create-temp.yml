name: Temporary Game Repo Bootstrap

on:
  issues:
    types: [opened]

permissions:
  contents: read
  id-token: write
  issues: write

jobs:
  create:
    if: github.event.issue.user.login == 'ilkerbekmezcii' && startsWith(github.event.issue.title, '[GAME REPO CREATE]')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Parse allowlisted repo
        id: req
        shell: bash
        env:
          ISSUE_BODY: ${{ github.event.issue.body }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import os,re
          body=os.environ.get('ISSUE_BODY','')
          m=re.search(r'^\s*repo\s*=\s*([A-Za-z0-9._-]+)\s*$',body,re.M)
          allowed={'PenguinRunner','SuperArcher','BilgiYarismasi','RouletteGame','SkyDefense','WallDefender'}
          if not m or m.group(1) not in allowed: raise SystemExit('invalid repo')
          with open(os.environ['GITHUB_OUTPUT'],'a') as f: f.write('repo='+m.group(1)+'\n')
          PY

      - name: Create private repo through OIDC broker
        id: create
        shell: bash
        env:
          REPO: ${{ steps.req.outputs.repo }}
          AUD: game-repo-admin-temp
          ENDPOINT: https://hiyduakdyfcpibwxrtan.supabase.co/functions/v1/playstore-route-head-probe-20260912
        run: |
          set -euo pipefail
          TOKEN="$(python3 - <<'PY'
          import json,os,urllib.parse,urllib.request
          url=os.environ['ACTIONS_ID_TOKEN_REQUEST_URL']+'&audience='+urllib.parse.quote(os.environ['AUD'])
          req=urllib.request.Request(url,headers={'Authorization':'bearer '+os.environ['ACTIONS_ID_TOKEN_REQUEST_TOKEN']})
          with urllib.request.urlopen(req,timeout=30) as r: print(json.load(r)['value'])
          PY
          )"
          OUT="$(curl --fail --silent --show-error --location -X POST -H "Authorization: Bearer ${TOKEN}" -H 'Content-Type: application/json' --data "{\"repo\":\"${REPO}\"}" "$ENDPOINT")"
          STATUS="$(python3 -c 'import json,sys; print(json.load(sys.stdin).get("status","unknown"))' <<<"$OUT")"
          echo "status=$STATUS" >> "$GITHUB_OUTPUT"

      - name: Report
        if: always()
        uses: actions/github-script@v8
        env:
          TARGET_REPO: ${{ steps.req.outputs.repo }}
          CREATE_STATUS: ${{ steps.create.outputs.status }}
          JOB_STATUS: ${{ job.status }}
        with:
          script: |
            const status = process.env.CREATE_STATUS || process.env.JOB_STATUS;
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: `GAME_REPO_CREATE_RESULT=${status} repo=${process.env.TARGET_REPO || 'unknown'}`
            });
