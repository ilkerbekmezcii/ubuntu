name: Tiwoo 500 Probe Temp

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/tiwoo-500-probe-temp.yml'

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Probe production resources
        shell: bash
        run: |
          set -euo pipefail
          KEY='sb_publishable_8Kt8qGl-LLpTfOYqsQdE5w_ZSv3uQld'
          probe(){
            local name="$1" method="$2" url="$3" data="${4:-}"
            echo "=== $name ==="
            if [ "$method" = GET ]; then
              curl -sS -D /tmp/h -o /tmp/b -H "apikey: $KEY" --max-time 20 "$url" || true
            else
              curl -sS -D /tmp/h -o /tmp/b -H "apikey: $KEY" -H 'content-type: application/json' -X "$method" --data "$data" --max-time 20 "$url" || true
            fi
            head -n 1 /tmp/h || true
            grep -iE '^(content-type|x-request-id|sb-request-id):' /tmp/h || true
            head -c 1200 /tmp/b || true
            echo
          }
          BASE='https://avpjpoywjyhnvbaqxyip.supabase.co/functions/v1'
          probe public-feed GET "$BASE/tiwoo-public-feed"
          probe meta GET "$BASE/tiwoo-meta"
          probe visitor-count GET "$BASE/tiwoo-visitor-count"
          probe adsense GET "$BASE/tiwoo-adsense"
          probe root GET 'https://tiwoo.vercel.app/'
