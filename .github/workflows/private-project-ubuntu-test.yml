name: Private Project Ubuntu Test

on:
  workflow_call:
    inputs:
      node-version:
        description: Node.js version
        required: false
        type: string
        default: '24'
      checkout-ref:
        description: Optional caller repository ref to test
        required: false
        type: string
        default: ''
      test-command:
        description: Command to run after dependency install
        required: true
        type: string

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout caller repository
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.checkout-ref != '' && inputs.checkout-ref || github.sha }}

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ inputs.node-version }}
          cache: ${{ hashFiles('package-lock.json') != '' && 'npm' || '' }}

      - name: Install dependencies
        shell: bash
        run: |
          if [ -f package-lock.json ] || [ -f npm-shrinkwrap.json ]; then
            npm ci
          else
            npm install --no-audit --no-fund
          fi

      - name: Run caller tests
        shell: bash
        run: ${{ inputs.test-command }}
