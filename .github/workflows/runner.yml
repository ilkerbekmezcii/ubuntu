name: Continuous Turkish Training

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: continuous-turkish-training
  cancel-in-progress: true

jobs:
  training-disabled:
    if: ${{ false }}
    runs-on: ubuntu-latest
    steps:
      - run: echo "Continuous training is intentionally stopped pending a clean retraining plan."
