name: Test Microsoft Earnings APK on Emulator

on:
  workflow_dispatch:
  push:
    branches: [work]
    paths:
      - 'android-earnings/**'
      - '.github/workflows/test-earnings-emulator.yml'
      - '.github/scripts/test-earnings-emulator.sh'

permissions:
  contents: read

jobs:
  emulator-smoke-test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Build APK
        working-directory: android-earnings
        shell: bash
        run: |
          set -euo pipefail
          gradle --no-daemon assembleDebug

      - name: Enable KVM
        shell: bash
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Emulator smoke test
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 30
          arch: x86_64
          profile: pixel_2
          disable-animations: true
          script: bash .github/scripts/test-earnings-emulator.sh

      - name: Upload emulator evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: earnings-emulator-test
          path: emulator-test/
          if-no-files-found: warn
          retention-days: 3
