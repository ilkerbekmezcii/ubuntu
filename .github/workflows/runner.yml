name: Public Turkish Data Job

on:
  workflow_dispatch:
  schedule:
    - cron: '17 * * * *'

permissions:
  contents: read

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Collect and validate Turkish-only public text
        shell: bash
        run: |
          set -euo pipefail
          python3 public_turkish_stream.py --out /tmp/turkish.jsonl --max-items 800
          python3 - <<'PY'
          import json
          p='/tmp/turkish.jsonl'
          rows=[json.loads(x) for x in open(p,encoding='utf-8') if x.strip()]
          assert rows, 'no Turkish samples collected'
          assert all(r.get('language')=='tr' for r in rows)
          print('validated_samples=',len(rows))
          PY

      - name: Train disposable student delta
        shell: bash
        run: |
          set -euo pipefail
          python3 -m pip install --disable-pip-version-check --quiet torch==2.7.1 --index-url https://download.pytorch.org/whl/cpu
          python3 student_delta.py --data /tmp/turkish.jsonl --out /tmp/student-delta.pt --steps 120
          ls -lh /tmp/student-delta.pt

      - name: Keep model data off the public repository
        shell: bash
        run: |
          set -euo pipefail
          rm -f /tmp/turkish.jsonl /tmp/student-delta.pt
          echo 'No dataset, checkpoint, token, endpoint, private repository name, or model identifier is committed or uploaded.'
