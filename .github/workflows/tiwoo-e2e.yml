name: Tiwoo Live E2E Audit

on:
  push:
    branches: [tiwoo-e2e]
    paths:
      - 'tiwoo-e2e.mjs'
      - '.github/workflows/tiwoo-e2e.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tiwoo-live-e2e
  cancel-in-progress: true

jobs:
  build-private-work:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      PRIVATE_REPO_TOKEN: ${{ secrets.GH_PAT || secrets.GITHUB_PAT || secrets.PAT || secrets.TOKEN }}
    steps:
      - name: Validate private-repo credential
        shell: bash
        run: |
          set -euo pipefail
          test -n "${PRIVATE_REPO_TOKEN:-}" || { echo 'private_repo_credential_missing'; exit 2; }

      - name: Checkout private Tiwoo work branch
        uses: actions/checkout@v4
        with:
          repository: ilkerbekmezcii/tiwoo
          ref: work
          token: ${{ env.PRIVATE_REPO_TOKEN }}
          path: tiwoo-work
          persist-credentials: false
          fetch-depth: 1

      - name: Set up Node 24
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: tiwoo-work/package-lock.json

      - name: Run full Tiwoo build gates
        shell: bash
        working-directory: tiwoo-work
        run: |
          set -euo pipefail
          if [ -d .github ]; then mv .github "$RUNNER_TEMP/tiwoo-private-github-metadata"; fi
          npm ci
          npm run build

  audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      TIWOO_TEST_USERNAME: ${{ secrets.TIWOO_TEST_USERNAME }}
      TIWOO_TEST_PASSWORD: ${{ secrets.TIWOO_TEST_PASSWORD }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Playwright Chromium
        shell: bash
        run: |
          set -euo pipefail
          npm init -y >/dev/null 2>&1
          npm install --no-save playwright@1.55.0 >/dev/null
          npx playwright install --with-deps chromium >/dev/null

      - name: Audit live Tiwoo
        shell: bash
        run: node tiwoo-e2e.mjs

      - name: Upload public audit evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tiwoo-live-audit
          path: artifacts/
          if-no-files-found: warn
          retention-days: 1
