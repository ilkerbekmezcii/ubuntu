name: Supabase Training Cleanup

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/supabase-training-cleanup.yml'

permissions:
  contents: read

jobs:
  cleanup:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
    steps:
      - name: Validate Supabase token presence
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "${SUPABASE_ACCESS_TOKEN:-}" ]; then
            echo 'SUPABASE_ACCESS_TOKEN_MISSING'
            exit 2
          fi
          echo 'SUPABASE_ACCESS_TOKEN_PRESENT=1'

      - name: Install and link Supabase CLI
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/supabase-cleanup
          cd /tmp/supabase-cleanup
          npx -y supabase@latest init >/dev/null
          npx -y supabase@latest link --project-ref hiyduakdyfcpibwxrtan --skip-pooler
          npx -y supabase@latest --version

      - name: Remove training bucket contents with Supabase CLI
        shell: bash
        run: |
          set -euo pipefail
          cd /tmp/supabase-cleanup
          echo 'BEFORE_LIST_BEGIN'
          npx -y supabase@latest storage ls ss:///turkish-training-private -r --experimental | tail -n 5 || true
          echo 'BEFORE_LIST_END'
          npx -y supabase@latest storage rm -r ss:///turkish-training-private --experimental
          echo 'AFTER_LIST_BEGIN'
          npx -y supabase@latest storage ls ss:///turkish-training-private -r --experimental || true
          echo 'AFTER_LIST_END'
