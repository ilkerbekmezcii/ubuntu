name: Codespace Partner Center inspect temp

on:
  push:
    paths:
      - '.github/workflows/codespace-partner-inspect-temp.yml'

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      GH_TOKEN: ${{ secrets.TEMP_CODESPACE_TOKEN }}
      CODESPACE_NAME: tiwoo-private-6v9v9jww67vj24v4q
    steps:
      - name: Inspect browser
        shell: bash
        run: |
          set -euo pipefail
          cat > /tmp/partner-inspect.cjs <<'NODE'
          const { chromium } = require('/home/codespace/.partner-browser-tools/node_modules/playwright');
          (async()=>{
            const browser = await chromium.connectOverCDP('http://127.0.0.1:9222');
            const pages = browser.contexts().flatMap(c=>c.pages());
            const result = [];
            for (const p of pages) {
              result.push({
                url: p.url(),
                title: await p.title().catch(()=>''),
                text: (await p.locator('body').innerText().catch(()=>'' )).slice(0,12000)
              });
            }
            console.log(JSON.stringify({pageCount:pages.length,pages:result},null,2));
            await browser.close();
          })().catch(e=>{console.error(e);process.exit(1)});
          NODE
          gh codespace cp -e -c "$CODESPACE_NAME" /tmp/partner-inspect.cjs 'remote:/tmp/partner-inspect.cjs'
          gh codespace ssh -c "$CODESPACE_NAME" 'node /tmp/partner-inspect.cjs'
