name: Partner Center Earnings via Direct Device OAuth

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/partner-center-earnings-live.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  earnings:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      PARTNER_CENTER_TENANT_ID: ${{ secrets.PARTNER_CENTER_TENANT_ID }}
      TZ: Europe/Istanbul
      AZURE_CLI_PUBLIC_CLIENT_ID: 04b07795-8ddb-461a-bbee-02f9e1bf7b46
    steps:
      - name: Start Partner Center device authorization and poll
        shell: bash
        run: |
          set -euo pipefail
          DEVICE=$(mktemp)
          curl -sS -f \
            -X POST "https://login.microsoftonline.com/${PARTNER_CENTER_TENANT_ID}/oauth2/v2.0/devicecode" \
            -H 'Content-Type: application/x-www-form-urlencoded' \
            --data-urlencode "client_id=${AZURE_CLI_PUBLIC_CLIENT_ID}" \
            --data-urlencode 'scope=https://api.partner.microsoft.com/.default offline_access openid profile' \
            -o "$DEVICE"

          VERIFY=$(jq -r '.verification_uri' "$DEVICE")
          USER_CODE=$(jq -r '.user_code' "$DEVICE")
          DEVICE_CODE=$(jq -r '.device_code' "$DEVICE")
          INTERVAL=$(jq -r '.interval // 5' "$DEVICE")
          EXPIRES=$(jq -r '.expires_in // 900' "$DEVICE")

          echo "verification_uri=$VERIFY"
          echo "user_code=$USER_CODE"
          echo "polling_for_up_to=${EXPIRES}s"

          START=$(date +%s)
          TOKEN_BODY=$(mktemp)
          while true; do
            NOW=$(date +%s)
            if [ $((NOW-START)) -ge "$EXPIRES" ]; then
              echo 'device_code_expired'
              exit 1
            fi

            HTTP=$(curl -sS -o "$TOKEN_BODY" -w '%{http_code}' \
              -X POST "https://login.microsoftonline.com/${PARTNER_CENTER_TENANT_ID}/oauth2/v2.0/token" \
              -H 'Content-Type: application/x-www-form-urlencoded' \
              --data-urlencode 'grant_type=urn:ietf:params:oauth:grant-type:device_code' \
              --data-urlencode "client_id=${AZURE_CLI_PUBLIC_CLIENT_ID}" \
              --data-urlencode "device_code=${DEVICE_CODE}")

            if [ "$HTTP" = "200" ]; then
              ACCESS_TOKEN=$(jq -r '.access_token' "$TOKEN_BODY")
              REFRESH_TOKEN=$(jq -r '.refresh_token // empty' "$TOKEN_BODY")
              test -n "$ACCESS_TOKEN"
              echo "::add-mask::$ACCESS_TOKEN"
              [ -z "$REFRESH_TOKEN" ] || echo "::add-mask::$REFRESH_TOKEN"
              printf '%s' "$ACCESS_TOKEN" > "$RUNNER_TEMP/partner_user_token"
              echo "access_token_received=true"
              echo "refresh_token_received=$([ -n "$REFRESH_TOKEN" ] && echo true || echo false)"
              break
            fi

            ERROR=$(jq -r '.error // empty' "$TOKEN_BODY")
            case "$ERROR" in
              authorization_pending)
                sleep "$INTERVAL"
                ;;
              slow_down)
                INTERVAL=$((INTERVAL+5))
                sleep "$INTERVAL"
                ;;
              *)
                echo "device_oauth_error=$ERROR"
                jq -c '{error,error_description}' "$TOKEN_BODY"
                exit 1
                ;;
            esac
          done

      - name: Verify Partner Center token claims
        shell: bash
        run: |
          set -euo pipefail
          TOKEN=$(cat "$RUNNER_TEMP/partner_user_token")
          PAYLOAD=$(printf '%s' "$TOKEN" | cut -d. -f2 | tr '_-' '/+' | awk '{l=length($0)%4;if(l==2)$0=$0"==";else if(l==3)$0=$0"=";print}' | base64 -d 2>/dev/null || true)
          echo "token_aud=$(printf '%s' "$PAYLOAD" | jq -r '.aud // empty')"
          echo "token_has_oid=$(printf '%s' "$PAYLOAD" | jq 'has("oid")')"
          echo "token_has_user_claim=$(printf '%s' "$PAYLOAD" | jq 'has("upn") or has("preferred_username") or has("unique_name")')"

      - name: Call Earnings API
        shell: bash
        run: |
          set -euo pipefail
          TOKEN=$(cat "$RUNNER_TEMP/partner_user_token")
          TODAY=$(TZ=Europe/Istanbul date +%F)
          FILTER="earningForDate ge ${TODAY} and earningForDate le ${TODAY}"
          BODY=$(mktemp)
          HEADERS=$(mktemp)
          METRICS=$(curl -sS -D "$HEADERS" -o "$BODY" -w '%{http_code} %{time_total}' \
            -X POST \
            -G 'https://api.partner.microsoft.com/v1.0/payouts/transactionhistory' \
            --data-urlencode "\$filter=${FILTER}" \
            --data-urlencode 'fileformat=csv' \
            -H "Authorization: Bearer ${TOKEN}" \
            -H 'Accept: application/json' \
            -H 'Content-Length: 0')
          CODE=$(awk '{print $1}' <<<"$METRICS")
          TIME=$(awk '{print $2}' <<<"$METRICS")
          echo "date=$TODAY"
          echo "earnings_http_status=$CODE"
          echo "earnings_seconds=$TIME"
          echo 'response_headers_begin'
          grep -Ei '^(HTTP/|request-id:|location:|content-type:|retry-after:)' "$HEADERS" || true
          echo 'response_headers_end'
          echo 'response_body_begin'
          cat "$BODY"
          echo
          echo 'response_body_end'
