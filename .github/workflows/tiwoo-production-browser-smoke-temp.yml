name: Tiwoo Production Browser Smoke Temp

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/tiwoo-production-browser-smoke-temp.yml'

permissions:
  contents: read

jobs:
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install Playwright Chromium
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/tiwoo-production-browser
          cd /tmp/tiwoo-production-browser
          npm init -y >/dev/null
          npm install --no-audit --no-fund playwright@1.55.0
          npx playwright install --with-deps chromium

      - name: Run real production Chromium smoke
        working-directory: /tmp/tiwoo-production-browser
        shell: bash
        run: |
          set -euo pipefail
          cat > test.mjs <<'JS'
          import { chromium } from 'playwright';
          import { strict as assert } from 'node:assert';
          const base='https://tiwoo.vercel.app';
          const result={pages:[],desktop:{},mobile:{},consoleErrors:[],pageErrors:[],failedRequests:[]};
          const browser=await chromium.launch({headless:true});
          const wire=(page,label)=>{
            page.setDefaultTimeout(7000);
            page.on('console',m=>{if(m.type()==='error')result.consoleErrors.push(`${label}: ${m.text()}`)});
            page.on('pageerror',e=>result.pageErrors.push(`${label}: ${String(e)}`));
            page.on('requestfailed',r=>{const u=r.url();if(u.startsWith(base))result.failedRequests.push(`${label}: ${r.method()} ${u} :: ${r.failure()?.errorText||'failed'}`)});
          };
          try{
            const page=await browser.newPage({viewport:{width:1440,height:1000}});wire(page,'desktop');
            for(const path of ['/','/hakkinda','/ozellikler','/privacy']){
              const response=await page.goto(base+path,{waitUntil:'domcontentloaded',timeout:25000});
              await page.waitForTimeout(600);
              const row={path,status:response?.status()||0,title:await page.title(),url:page.url(),bodyLength:(await page.locator('body').innerText()).length};
              result.pages.push(row);
              assert.ok(row.status>=200&&row.status<400,`${path} HTTP ${row.status}`);
              assert.ok(row.bodyLength>20,`${path} body unexpectedly empty`);
            }
            await page.goto(base+'/',{waitUntil:'domcontentloaded',timeout:25000});await page.waitForTimeout(1800);
            const login=page.locator('#publicLogin:visible,#publicLoginHero:visible').first();
            assert.ok(await login.count(),'desktop login control missing');
            await login.click();await page.waitForTimeout(300);
            result.desktop.loginModal={visible:await page.locator('#authModal').isVisible().catch(()=>false),title:await page.locator('#authTitle').innerText().catch(()=>null)};
            assert.equal(result.desktop.loginModal.visible,true,'desktop login modal did not open');

            const mobile=await browser.newPage({viewport:{width:390,height:844},isMobile:true});wire(mobile,'mobile');
            const mr=await mobile.goto(base+'/',{waitUntil:'domcontentloaded',timeout:25000});await mobile.waitForTimeout(1800);
            const scrollWidth=await mobile.evaluate(()=>document.documentElement.scrollWidth),clientWidth=await mobile.evaluate(()=>document.documentElement.clientWidth);
            result.mobile.home={status:mr?.status()||0,scrollWidth,clientWidth};
            assert.ok(result.mobile.home.status>=200&&result.mobile.home.status<400,`mobile home HTTP ${result.mobile.home.status}`);
            assert.ok(scrollWidth<=clientWidth+2,`mobile horizontal overflow ${scrollWidth}>${clientWidth}`);
            const mobileLogin=mobile.locator('#publicLogin:visible,#publicLoginHero:visible').first();
            assert.ok(await mobileLogin.count(),'mobile login control missing');
            await mobileLogin.click();await mobile.waitForTimeout(300);
            result.mobile.loginModal={visible:await mobile.locator('#authModal').isVisible().catch(()=>false),scrollWidth:await mobile.evaluate(()=>document.documentElement.scrollWidth),clientWidth:await mobile.evaluate(()=>document.documentElement.clientWidth)};
            assert.equal(result.mobile.loginModal.visible,true,'mobile login modal did not open');
            assert.ok(result.mobile.loginModal.scrollWidth<=result.mobile.loginModal.clientWidth+2,'mobile modal creates horizontal overflow');

            assert.deepEqual(result.pageErrors,[],'page errors detected');
            assert.deepEqual(result.consoleErrors,[],'console errors detected');
            assert.deepEqual(result.failedRequests,[],'same-origin failed requests detected');
            console.log(JSON.stringify({ok:true,...result},null,2));
          } finally { await browser.close(); }
          JS
          node test.mjs | tee result.log

      - name: Show result
        if: always()
        shell: bash
        run: cat /tmp/tiwoo-production-browser/result.log 2>/dev/null || true
