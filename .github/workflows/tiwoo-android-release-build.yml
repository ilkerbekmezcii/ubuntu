name: Tiwoo Android Release Build

on:
  issues:
    types: [opened]

permissions:
  contents: read
  issues: write

concurrency:
  group: tiwoo-android-release
  cancel-in-progress: false

jobs:
  build:
    if: github.event.issue.user.login == 'ilkerbekmezcii' && github.event.issue.title == '[TIWOO ANDROID BUILD 1.1.3 DIRECT]'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      GHHTTP_SECRET_1: ${{ secrets.GHHTTP_SECRET_1 }}
      GHHTTP_SECRET_2: ${{ secrets.GHHTTP_SECRET_2 }}
      GHHTTP_SECRET_3: ${{ secrets.GHHTTP_SECRET_3 }}
      GHHTTP_SECRET_4: ${{ secrets.GHHTTP_SECRET_4 }}
      GHHTTP_SECRET_5: ${{ secrets.GHHTTP_SECRET_5 }}
      GHHTTP_SECRET_6: ${{ secrets.GHHTTP_SECRET_6 }}
      GHHTTP_SECRET_7: ${{ secrets.GHHTTP_SECRET_7 }}
      GHHTTP_SECRET_8: ${{ secrets.GHHTTP_SECRET_8 }}

    steps:
      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Fetch Tiwoo source
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import io, os, tarfile, urllib.request, urllib.error
          repo_api = 'https://api.github.com/repos/ilkerbekmezcii/tiwoo'
          token = None
          for i in range(1, 9):
              candidate = os.environ.get(f'GHHTTP_SECRET_{i}', '').strip()
              if not candidate:
                  continue
              req = urllib.request.Request(repo_api, headers={
                  'Authorization': f'Bearer {candidate}',
                  'Accept': 'application/vnd.github+json',
                  'User-Agent': 'tiwoo-android-builder'
              })
              try:
                  with urllib.request.urlopen(req, timeout=20) as r:
                      if r.status == 200:
                          token = candidate
                          break
              except Exception:
                  pass
          if not token:
              raise SystemExit('No configured GitHub secret can access ilkerbekmezcii/tiwoo')
          print('::add-mask::' + token)
          req = urllib.request.Request(repo_api + '/tarball/main', headers={
              'Authorization': f'Bearer {token}',
              'Accept': 'application/vnd.github+json',
              'User-Agent': 'tiwoo-android-builder'
          })
          with urllib.request.urlopen(req, timeout=120) as r:
              data = r.read()
          root = '/tmp/tiwoo'
          os.makedirs(root, exist_ok=True)
          with tarfile.open(fileobj=io.BytesIO(data), mode='r:gz') as tf:
              members = tf.getmembers()
              prefix = members[0].name.split('/')[0] + '/'
              for m in members:
                  if not m.name.startswith(prefix):
                      continue
                  rel = m.name[len(prefix):]
                  if not rel:
                      continue
                  m.name = rel
                  tf.extract(m, root, filter='data')
          print('Tiwoo source fetched')
          PY

      - name: Install Gradle 8.11.1
        shell: bash
        run: |
          set -euo pipefail
          curl -fL --retry 5 --retry-delay 2 -o /tmp/gradle.zip https://services.gradle.org/distributions/gradle-8.11.1-bin.zip
          unzip -q /tmp/gradle.zip -d /tmp
          echo '/tmp/gradle-8.11.1/bin' >> "$GITHUB_PATH"

      - name: Ensure Android SDK 36
        shell: bash
        run: |
          set -euo pipefail
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          test -x "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" 'platform-tools' 'platforms;android-36' 'build-tools;36.0.0'

      - name: Build Firebase release APK and AAB
        working-directory: /tmp/tiwoo/android
        shell: bash
        run: |
          set -euo pipefail
          printf 'android.useAndroidX=true\n' > gradle.properties
          gradle --no-daemon --stacktrace assembleRelease bundleRelease
          test -s app/build/outputs/apk/release/app-release-unsigned.apk
          test -s app/build/outputs/bundle/release/app-release.aab
          mkdir -p /tmp/out
          cp app/build/outputs/apk/release/app-release-unsigned.apk /tmp/out/Tiwoo-1.1.3-full-unsigned.apk
          cp app/build/outputs/bundle/release/app-release.aab /tmp/out/Tiwoo-1.1.3-full-unsigned.aab
          sha256sum /tmp/out/*

      - name: Upload build
        uses: actions/upload-artifact@v4
        with:
          name: tiwoo-1.1.3-full-unsigned
          path: /tmp/out/*
          if-no-files-found: error
          retention-days: 1

      - name: Report result
        if: always()
        uses: actions/github-script@v8
        with:
          script: |
            await github.rest.issues.createComment({owner:context.repo.owner,repo:context.repo.repo,issue_number:context.issue.number,body:`TIWOO_ANDROID_BUILD=${context.job} / ${context.runId}`});
