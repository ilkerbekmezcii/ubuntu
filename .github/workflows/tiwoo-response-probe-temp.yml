name: Tiwoo Response Probe Temp

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/tiwoo-response-probe-temp.yml'

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install browser
        shell: bash
        run: |
          mkdir -p /tmp/tiwoo-response
          cd /tmp/tiwoo-response
          npm init -y >/dev/null
          npm install --no-audit --no-fund playwright@1.55.0 >/dev/null
          npx playwright install chromium >/dev/null
      - name: Capture responses
        working-directory: /tmp/tiwoo-response
        shell: bash
        run: |
          cat > probe.mjs <<'JS'
          import { chromium } from 'playwright';
          const browser=await chromium.launch({headless:true});
          for(const path of ['/','/admin']){
            const page=await browser.newPage({viewport:{width:1440,height:1000}});
            const bad=[];
            page.on('response',r=>{if(r.status()>=400)bad.push({status:r.status(),url:r.url(),type:r.request().resourceType()})});
            page.on('console',m=>{if(m.type()==='error')console.log('CONSOLE',path,m.text())});
            try{const r=await page.goto('https://tiwoo.vercel.app'+path,{waitUntil:'domcontentloaded',timeout:25000});await page.waitForTimeout(5000);console.log('PAGE',path,r?.status(),page.url());console.log('BAD',JSON.stringify(bad));}catch(e){console.log('PAGE_ERROR',path,e.message)}
            await page.close();
          }
          await browser.close();
          JS
          node probe.mjs
