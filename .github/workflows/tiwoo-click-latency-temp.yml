name: Tiwoo Click Latency Temp
on:
  push:
    branches: [main]
    paths: ['.github/workflows/tiwoo-click-latency-temp.yml']
permissions:
  contents: read
jobs:
  latency:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install Playwright
        run: |
          cd /tmp
          npm init -y >/dev/null
          npm install playwright@1.55.0 >/dev/null
          npx playwright install --with-deps chromium >/dev/null
      - name: Measure Tiwoo UI click latency
        working-directory: /tmp
        run: |
          cat > click-latency.mjs <<'EOF'
          import {chromium,devices} from 'playwright';
          import {randomUUID} from 'node:crypto';
          const base='https://tiwoo.vercel.app';
          const browser=await chromium.launch({headless:true});
          const username=`lat_${Date.now().toString(36).slice(-8)}`;
          const password=`T!${randomUUID().replaceAll('-','').slice(0,20)}a9`;
          const report={desktop:null,mobile:null,issues:[],cleanup:null};
          let token='',refresh='';
          const pct=(arr,p)=>{if(!arr.length)return 0;const a=[...arr].sort((x,y)=>x-y);return a[Math.min(a.length-1,Math.max(0,Math.ceil(p*a.length)-1))]};
          const summarize=samples=>{
            const v=samples.map(x=>x.frame1).filter(Number.isFinite);
            return {count:v.length,p50:+pct(v,.50).toFixed(2),p95:+pct(v,.95).toFixed(2),max:+Math.max(0,...v).toFixed(2),over50:v.filter(x=>x>50).length,over100:v.filter(x=>x>100).length};
          };
          async function installProbe(page){
            await page.evaluate(()=>{
              window.__tiwooClickPerf={samples:[],events:[],longTasks:[]};
              document.addEventListener('click',e=>{
                const t0=performance.now();
                const el=e.target instanceof Element?e.target.closest('button,a,[role="button"],input')||e.target:null;
                const label=(el?.getAttribute?.('aria-label')||el?.getAttribute?.('title')||el?.textContent||el?.id||el?.tagName||'unknown').trim().replace(/\s+/g,' ').slice(0,80);
                requestAnimationFrame(t1=>requestAnimationFrame(t2=>window.__tiwooClickPerf.samples.push({label,frame1:t1-t0,frame2:t2-t0})));
              },true);
              try{new PerformanceObserver(list=>{for(const e of list.getEntries()){if(e.name==='click')window.__tiwooClickPerf.events.push({inputDelay:e.processingStart-e.startTime,processing:e.processingEnd-e.processingStart,duration:e.duration,interactionId:e.interactionId||0})}}).observe({type:'event',buffered:true,durationThreshold:0})}catch{}
              try{new PerformanceObserver(list=>{for(const e of list.getEntries())window.__tiwooClickPerf.longTasks.push({start:e.startTime,duration:e.duration})}).observe({type:'longtask',buffered:true})}catch{}
            });
          }
          async function twoFrames(page){await page.evaluate(()=>new Promise(r=>requestAnimationFrame(()=>requestAnimationFrame(r))))}
          async function safeClick(page,locator,name){
            if(!(await locator.isVisible().catch(()=>false))){report.issues.push(`missing:${name}`);return false}
            await locator.click({timeout:5000});await twoFrames(page);return true;
          }
          async function runContext(context,label){
            const page=await context.newPage();
            const errors=[];page.on('pageerror',e=>errors.push(String(e?.message||e)));
            await page.goto(base,{waitUntil:'domcontentloaded',timeout:30000});
            await page.evaluate(async s=>{const c=window.TiwooSupabase?.sb;if(!c)return false;const {data,error}=await c.auth.setSession({access_token:s.access,refresh_token:s.refresh});return !error&&!!data?.session},{access:token,refresh});
            await page.reload({waitUntil:'domcontentloaded',timeout:30000});await page.waitForTimeout(2200);
            await installProbe(page);
            const navNames=label==='mobile'?['Ana Sayfa','Bildirimler']:['Ana Sayfa','Bildirimler','Arkadaşlar','Kaydedilenler','Profil','Ayarlar'];
            for(let round=0;round<6;round++){
              for(const name of navNames){
                const b=page.getByRole('button',{name,exact:true}).first();
                await safeClick(page,b,`${label}:${name}`);await page.waitForTimeout(25);
              }
            }
            if(label==='desktop'){
              const home=page.getByRole('button',{name:'Ana Sayfa',exact:true}).first();await safeClick(page,home,'desktop:home-final');
              const inline=page.locator('#inlineText');
              if(await inline.isVisible().catch(()=>false)){
                const marker='latency-'+Date.now();
                await inline.fill(marker);await safeClick(page,page.locator('#inlineSend'),'desktop:post-send');await page.waitForTimeout(500);
                const card=page.locator('[data-post]').filter({hasText:marker}).first();
                if(await card.count()){
                  for(let i=0;i<5;i++){
                    await safeClick(page,card.locator('[data-act="like"]'),'desktop:like');await page.waitForTimeout(25);
                    await safeClick(page,card.locator('[data-act="like"]'),'desktop:unlike');await page.waitForTimeout(25);
                    await safeClick(page,card.locator('[data-act="bookmark"]'),'desktop:bookmark');await page.waitForTimeout(25);
                    await safeClick(page,card.locator('[data-act="bookmark"]'),'desktop:unbookmark');await page.waitForTimeout(25);
                  }
                  page.once('dialog',d=>d.accept());await safeClick(page,card.locator('[data-delete]'),'desktop:delete');await page.waitForTimeout(300);
                }else report.issues.push('missing:desktop:test-post-card');
              }else report.issues.push('missing:desktop:composer');
            }
            await page.waitForTimeout(300);
            const perf=await page.evaluate(()=>window.__tiwooClickPerf);
            const input=perf.events.map(x=>x.inputDelay).filter(Number.isFinite);
            const duration=perf.events.map(x=>x.duration).filter(Number.isFinite);
            const out={frame:summarize(perf.samples),sampleWorst:[...perf.samples].sort((a,b)=>b.frame1-a.frame1).slice(0,10).map(x=>({label:x.label,frame1:+x.frame1.toFixed(2),frame2:+x.frame2.toFixed(2)})),eventTiming:{count:perf.events.length,inputP95:+pct(input,.95).toFixed(2),inputMax:+Math.max(0,...input).toFixed(2),durationP95:+pct(duration,.95).toFixed(2),durationMax:+Math.max(0,...duration).toFixed(2)},longTasks:{count:perf.longTasks.length,max:+Math.max(0,...perf.longTasks.map(x=>x.duration)).toFixed(2)},pageErrors:errors};
            await page.close();return out;
          }
          try{
            const setup=await browser.newContext({viewport:{width:1440,height:1000}});const p=await setup.newPage();await p.goto(base,{waitUntil:'domcontentloaded',timeout:30000});
            const reg=await p.request.post(`${base}/api/tiwoo-auth`,{data:{action:'register',username,password,name:'Latency Test'}});const payload=await reg.json().catch(()=>({}));
            if(!reg.ok()||!payload?.session?.accessToken)throw Error(`register_failed_${reg.status()}`);
            token=payload.session.accessToken;refresh=payload.session.refreshToken;await setup.close();
            report.desktop=await runContext(await browser.newContext({viewport:{width:1440,height:1000}}),'desktop');
            report.mobile=await runContext(await browser.newContext({...devices['Pixel 7']}),'mobile');
            for(const [name,r] of [['desktop',report.desktop],['mobile',report.mobile]]){
              if(r.frame.p95>50)report.issues.push(`${name}:frame_p95_over_50ms:${r.frame.p95}`);
              if(r.frame.max>100)report.issues.push(`${name}:frame_max_over_100ms:${r.frame.max}`);
              if(r.eventTiming.inputMax>100)report.issues.push(`${name}:input_delay_over_100ms:${r.eventTiming.inputMax}`);
              if(r.pageErrors.length)report.issues.push(`${name}:page_errors:${r.pageErrors.length}`);
            }
          }catch(e){report.issues.push('fatal:'+String(e?.message||e))}
          finally{
            if(token){const c=await browser.newContext();const p=await c.newPage();const del=await p.request.post(`${base}/api/tiwoo-auth`,{headers:{authorization:`Bearer ${token}`},data:{action:'account_delete',confirmation:username,acknowledged:true}}).catch(()=>null);report.cleanup=del?{status:del.status(),ok:del.ok()}:{status:0,ok:false};await c.close()}
            await browser.close();
          }
          console.log('TIWOO_CLICK_LATENCY_REPORT='+JSON.stringify(report));
          if(report.issues.some(x=>x.startsWith('fatal:')||x.includes('page_errors')))process.exitCode=1;
          EOF
          node click-latency.mjs
      - name: Cleanup temp script
        if: always()
        run: rm -f /tmp/click-latency.mjs
