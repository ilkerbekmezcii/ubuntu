name: Supabase Training Cleanup

on:
  issues:
    types: [opened]

permissions:
  contents: read
  id-token: write

jobs:
  cleanup:
    if: github.event.issue.user.login == 'ilkerbekmezcii' && github.event.issue.title == '[SUPABASE TRAINING CLEANUP]'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Delete training bucket through OIDC-authenticated curl CLI
        shell: bash
        env:
          CLEANUP_URL: https://hiyduakdyfcpibwxrtan.supabase.co/functions/v1/training-controller-v2-temp
          CLEANUP_AUD: training-cleanup-cli
        run: |
          set -euo pipefail
          TOKEN="$(python3 - <<'PY'
          import json, os, urllib.parse, urllib.request
          u=os.environ['ACTIONS_ID_TOKEN_REQUEST_URL']+'&audience='+urllib.parse.quote(os.environ['CLEANUP_AUD'])
          req=urllib.request.Request(u,headers={'Authorization':'bearer '+os.environ['ACTIONS_ID_TOKEN_REQUEST_TOKEN']})
          with urllib.request.urlopen(req,timeout=30) as r:
              print(json.load(r)['value'])
          PY
          )"
          HTTP_CODE="$(curl --silent --show-error --location -X POST \
            -H "Authorization: Bearer ${TOKEN}" \
            -H 'Content-Type: application/json' \
            -o /tmp/cleanup-response.json \
            -w '%{http_code}' \
            "${CLEANUP_URL}")"
          echo "CLEANUP_HTTP_STATUS=${HTTP_CODE}"
          python3 - <<'PY'
          import json
          with open('/tmp/cleanup-response.json','r',encoding='utf-8') as f:
              d=json.load(f)
          print('CLEANUP_OK='+str(bool(d.get('ok'))).lower())
          if not d.get('ok'):
              raise SystemExit('cleanup endpoint returned failure')
          PY
          test "$HTTP_CODE" = "200"
          rm -f /tmp/cleanup-response.json
