name: Tiwoo Cleanup Audit

on:
  push:
    branches: [main]
    paths: ['.github/workflows/tiwoo-cleanup-audit.yml']
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Fetch private Tiwoo cleanup payload to ephemeral disk
        shell: bash
        env:
          PAYLOAD_URL: https://hiyduakdyfcpibwxrtan.supabase.co/functions/v1/tiwoo-cleanup-payload
          PAYLOAD_AUD: tiwoo-cleanup-payload-v1
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, os, pathlib, urllib.parse, urllib.request
          base=os.environ['PAYLOAD_URL']
          aud=os.environ['PAYLOAD_AUD']
          oidc=os.environ['ACTIONS_ID_TOKEN_REQUEST_URL']+'&audience='+urllib.parse.quote(aud)
          req=urllib.request.Request(oidc,headers={'Authorization':'bearer '+os.environ['ACTIONS_ID_TOKEN_REQUEST_TOKEN']})
          with urllib.request.urlopen(req,timeout=30) as r:
              token=json.load(r)['value']
          def get(name):
              url=base+'?file='+urllib.parse.quote(name)
              req=urllib.request.Request(url,headers={'Authorization':'Bearer '+token})
              with urllib.request.urlopen(req,timeout=60) as r:return r.read()
          files=json.loads(get('manifest'))
          root=pathlib.Path('/tmp/tiwoo-cleanup')
          for name in files:
              dest=root/name
              dest.parent.mkdir(parents=True,exist_ok=True)
              dest.write_bytes(get(name))
          print('PAYLOAD_FILES='+str(len(files)))
          PY

      - name: Syntax-check frontend cleanup files
        working-directory: /tmp/tiwoo-cleanup
        run: |
          set -euo pipefail
          node --check public/tiwoo-ai-mention.js
          node --check public/composer-mention-fixes.js

      - name: Type-check autonomous publisher cleanup
        working-directory: /tmp/tiwoo-cleanup
        run: deno check supabase/functions/tiwoo-ai-publisher/index.ts

      - name: Audit canonical handles and removed behavior routing
        working-directory: /tmp/tiwoo-cleanup
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re
          files=[p for p in Path('.').rglob('*') if p.is_file()]
          text='\n'.join(p.read_text(encoding='utf-8') for p in files)
          legacy=[r'@kata(?![A-Za-z0-9_.-])',r'@tiwoo(?![A-Za-z0-9_.-])',r'@lina_ai(?![A-Za-z0-9_.-])']
          for pattern in legacy:
              if re.search(pattern,text,re.I): raise SystemExit('legacy handle remains: '+pattern)
          for token in ['ADMIN_HANDLE','adminRule','canonicalBotHandle','canonicalPlatformHandle','quotaHeavyDevelopmentRequest','tiwooLinaChatGuard']:
              if token.lower() in text.lower(): raise SystemExit('obsolete behavior token remains: '+token)
          if '@luna' not in text or '@lina' not in text: raise SystemExit('canonical handles missing')
          if 'Gereksiz iş yapma' not in text: raise SystemExit('no-unnecessary-work instruction missing')
          print('cleanup_static_audit=ok')
          PY

      - name: Smoke-test public Tiwoo and retired endpoint protection
        shell: bash
        run: |
          set -euo pipefail
          test "$(curl -L -sS -o /tmp/tiwoo-home -w '%{http_code}' https://tiwoo.vercel.app/)" = "200"
          code="$(curl -sS -o /tmp/retired -w '%{http_code}' https://avpjpoywjyhnvbaqxyip.supabase.co/functions/v1/tiwoo-admin-auth-check)"
          test "$code" = "401" -o "$code" = "410"
          echo "production_home=200 retired_endpoint=$code"

      - name: Remove private payload from runner
        if: always()
        run: |
          rm -rf /tmp/tiwoo-cleanup /tmp/tiwoo-home /tmp/retired
          test ! -e /tmp/tiwoo-cleanup
