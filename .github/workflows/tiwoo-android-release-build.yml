name: Tiwoo Android Release Build

on:
  push:
    paths:
      - 'triggers/tiwoo-android-build.txt'

permissions:
  contents: read
  id-token: write

concurrency:
  group: tiwoo-android-release
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Fetch Tiwoo source and signing material
        shell: bash
        env:
          PAYLOAD_URL: https://hiyduakdyfcpibwxrtan.supabase.co/functions/v1/tiwoo-runner-source-once
          PAYLOAD_AUD: tiwoo-android-build-v1
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, os, pathlib, urllib.parse, urllib.request
          oidc=os.environ['ACTIONS_ID_TOKEN_REQUEST_URL']+'&audience='+urllib.parse.quote(os.environ['PAYLOAD_AUD'])
          req=urllib.request.Request(oidc,headers={'Authorization':'bearer '+os.environ['ACTIONS_ID_TOKEN_REQUEST_TOKEN']})
          with urllib.request.urlopen(req,timeout=30) as r:
              token=json.load(r)['value']
          base=os.environ['PAYLOAD_URL']
          def get(name):
              req=urllib.request.Request(base+'?file='+urllib.parse.quote(name),headers={'Authorization':'Bearer '+token})
              with urllib.request.urlopen(req,timeout=90) as r:
                  return r.read()
          signing=pathlib.Path('/tmp/signing')
          signing.mkdir(parents=True,exist_ok=True)
          (signing/'ilkerbekmezci.jks').write_bytes(get('signing-keystore'))
          (signing/'signing.env').write_bytes(get('signing-env'))
          os.chmod(signing/'ilkerbekmezci.jks',0o600)
          os.chmod(signing/'signing.env',0o600)
          manifest=json.loads(get('manifest'))
          root=pathlib.Path('/tmp/tiwoo')
          for name in manifest['files']:
              dest=root/name
              dest.parent.mkdir(parents=True,exist_ok=True)
              dest.write_bytes(get(name))
          print('ANDROID_SOURCE_FILES='+str(len(manifest['files'])))
          print('SIGNING_MATERIAL=loaded')
          PY

      - name: Install Gradle 8.11.1
        shell: bash
        run: |
          set -euo pipefail
          curl -fL --retry 5 --retry-delay 2 -o /tmp/gradle.zip https://services.gradle.org/distributions/gradle-8.11.1-bin.zip
          unzip -q /tmp/gradle.zip -d /tmp
          echo '/tmp/gradle-8.11.1/bin' >> "$GITHUB_PATH"

      - name: Ensure Android SDK 36
        shell: bash
        run: |
          set -euo pipefail
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          test -x "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" 'platform-tools' 'platforms;android-36' 'build-tools;36.0.0'

      - name: Build Firebase release APK and AAB
        working-directory: /tmp/tiwoo/android
        shell: bash
        run: |
          set -euo pipefail
          printf 'android.useAndroidX=true\n' > gradle.properties
          gradle --no-daemon --stacktrace assembleRelease bundleRelease
          test -s app/build/outputs/apk/release/app-release-unsigned.apk
          test -s app/build/outputs/bundle/release/app-release.aab

      - name: Sign and verify release
        working-directory: /tmp/tiwoo/android
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import os, shlex
          vals={}
          for raw in Path('/tmp/signing/signing.env').read_text().splitlines():
              line=raw.strip()
              if not line or line.startswith('#') or '=' not in line: continue
              k,v=line.split('=',1)
              k=k.strip(); v=v.strip().strip('"').strip("'")
              vals[k]=v
          def pick(pred):
              for k,v in vals.items():
                  if pred(k.upper()) and v: return v
              return ''
          store=pick(lambda k: ('STORE' in k or 'JKS' in k or 'KEYSTORE' in k) and ('PASS' in k or 'PASSWORD' in k))
          if not store: store=pick(lambda k: 'PASS' in k or 'PASSWORD' in k)
          keypass=pick(lambda k: 'KEY' in k and ('PASS' in k or 'PASSWORD' in k)) or store
          alias=pick(lambda k: 'ALIAS' in k)
          if not store: raise SystemExit('Signing env does not contain a store password')
          p=Path('/tmp/signing/canonical.env')
          p.write_text('STORE_PASS='+shlex.quote(store)+'\nKEY_PASS='+shlex.quote(keypass)+'\nKEY_ALIAS='+shlex.quote(alias)+'\n')
          os.chmod(p,0o600)
          PY
          source /tmp/signing/canonical.env
          echo "::add-mask::$STORE_PASS"
          echo "::add-mask::$KEY_PASS"
          KS=/tmp/signing/ilkerbekmezci.jks
          if [ -z "$KEY_ALIAS" ]; then
            KEY_ALIAS="$(LC_ALL=C keytool -list -v -keystore "$KS" -storepass "$STORE_PASS" 2>/dev/null | sed -n 's/^Alias name: //p' | head -n1)"
          fi
          test -n "$KEY_ALIAS"
          echo "SIGNING_ALIAS_RESOLVED=yes"
          BT="$ANDROID_HOME/build-tools/36.0.0"
          mkdir -p /tmp/out
          "$BT/zipalign" -f -p 4 app/build/outputs/apk/release/app-release-unsigned.apk /tmp/out/Tiwoo-1.1.3-full-aligned.apk
          "$BT/apksigner" sign --ks "$KS" --ks-key-alias "$KEY_ALIAS" --ks-pass "pass:$STORE_PASS" --key-pass "pass:$KEY_PASS" --out /tmp/out/Tiwoo-1.1.3-full-signed.apk /tmp/out/Tiwoo-1.1.3-full-aligned.apk
          "$BT/apksigner" verify --verbose /tmp/out/Tiwoo-1.1.3-full-signed.apk
          cp app/build/outputs/bundle/release/app-release.aab /tmp/out/Tiwoo-1.1.3-full-signed.aab
          jarsigner -keystore "$KS" -storepass "$STORE_PASS" -keypass "$KEY_PASS" /tmp/out/Tiwoo-1.1.3-full-signed.aab "$KEY_ALIAS"
          jarsigner -verify /tmp/out/Tiwoo-1.1.3-full-signed.aab
          rm -f /tmp/out/Tiwoo-1.1.3-full-aligned.apk
          sha256sum /tmp/out/Tiwoo-1.1.3-full-signed.apk /tmp/out/Tiwoo-1.1.3-full-signed.aab

      - name: Upload signed build
        uses: actions/upload-artifact@v4
        with:
          name: tiwoo-1.1.3-full-signed
          path: |
            /tmp/out/Tiwoo-1.1.3-full-signed.apk
            /tmp/out/Tiwoo-1.1.3-full-signed.aab
          if-no-files-found: error
          retention-days: 1
