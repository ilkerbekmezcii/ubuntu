name: Tiwoo Live E2E Audit

on:
  push:
    branches: [tiwoo-e2e]
    paths:
      - 'tiwoo-e2e.mjs'
      - 'tiwoo-interactions.mjs'
      - '.github/workflows/tiwoo-e2e.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tiwoo-live-e2e
  cancel-in-progress: true

jobs:
  audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Install Playwright Chromium
        shell: bash
        run: |
          set -euo pipefail
          npm init -y >/dev/null 2>&1
          npm install --no-save playwright@1.55.0 >/dev/null
          npx playwright install --with-deps chromium >/dev/null

      - name: Audit live Tiwoo
        id: smoke
        continue-on-error: true
        shell: bash
        run: node tiwoo-e2e.mjs

      - name: Prepare interaction audit
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('tiwoo-interactions.mjs')
          s=p.read_text()
          s=s.replace("await setSession(primary);\n\n  result.actions.create", "await setSession(primary); await rpc('privacy',{isPrivate:false});\n\n  result.actions.create")
          s=s.replace("await page.locator('#followProfile').click(); await sleep(1200);", "await page.locator('#followProfile').click(); await sleep(250); const confirm=page.locator('#tiwooConfirmModal .tiwoo-confirm-approve'); if(await confirm.isVisible().catch(()=>false))await confirm.click(); await sleep(950);")
          p.write_text(s)
          PY

      - name: Audit Tiwoo interactions
        id: interactions
        continue-on-error: true
        shell: bash
        run: node tiwoo-interactions.mjs

      - name: Upload public audit evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tiwoo-live-audit
          path: artifacts/
          if-no-files-found: warn
          retention-days: 1

      - name: Fail on audit errors
        if: always()
        shell: bash
        run: |
          if [ "${{ steps.smoke.outcome }}" != "success" ] || [ "${{ steps.interactions.outcome }}" != "success" ]; then
            exit 1
          fi
