name: Test Microsoft Earnings APK on Emulator

on:
  workflow_dispatch:
  push:
    branches: [work]
    paths:
      - 'android-earnings/**'
      - '.github/workflows/test-earnings-emulator.yml'

permissions:
  contents: read

jobs:
  emulator-smoke-test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Build APK
        working-directory: android-earnings
        shell: bash
        run: |
          set -euo pipefail
          gradle --no-daemon assembleDebug

      - name: Enable KVM
        shell: bash
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Emulator smoke test
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 30
          arch: x86_64
          profile: pixel_2
          disable-animations: true
          script: |
            set -eu
            APK=android-earnings/app/build/outputs/apk/debug/app-debug.apk
            PKG=com.ilker.microsoftreport
            ACT=.MainActivity

            adb wait-for-device
            adb install -r "$APK"
            adb logcat -c
            adb shell am force-stop "$PKG"
            adb shell am start -W -n "$PKG/$ACT"
            sleep 3

            mkdir -p emulator-test
            adb shell uiautomator dump /sdcard/window.xml >/dev/null
            adb pull /sdcard/window.xml emulator-test/window-initial.xml >/dev/null
            adb exec-out screencap -p > emulator-test/initial.png

            grep -Fq 'Microsoft Earnings' emulator-test/window-initial.xml
            grep -Fq 'Bugün' emulator-test/window-initial.xml
            grep -Fq 'Bu Ay' emulator-test/window-initial.xml
            grep -Fq '.env dosyası seç' emulator-test/window-initial.xml
            grep -Fq 'Microsoft ile giriş / MFA' emulator-test/window-initial.xml

            printf 'TENANT_ID=test-tenant\nCLIENT_ID=test-client\n' > emulator-test/test.env
            adb push emulator-test/test.env /sdcard/Download/test.env >/dev/null

            python3 - <<'PY'
            import re, subprocess, time, xml.etree.ElementTree as ET

            def adb(*args):
                subprocess.check_call(['adb', *args])

            def dump(remote, local):
                adb('shell','uiautomator','dump',remote)
                adb('pull',remote,local)
                return ET.parse(local).getroot()

            def tap_node(node):
                m=re.match(r'\[(\d+),(\d+)\]\[(\d+),(\d+)\]', node.attrib.get('bounds',''))
                if not m:
                    raise RuntimeError('node has no usable bounds')
                x=(int(m.group(1))+int(m.group(3)))//2
                y=(int(m.group(2))+int(m.group(4)))//2
                adb('shell','input','tap',str(x),str(y))

            def find(root, text, contains=False):
                for n in root.iter('node'):
                    values=(n.attrib.get('text',''), n.attrib.get('content-desc',''))
                    if any((text in v if contains else text == v) for v in values):
                        return n
                return None

            root=ET.parse('emulator-test/window-initial.xml').getroot()
            btn=find(root,'.env dosyası seç')
            if btn is None:
                raise RuntimeError('ENV button not found')
            tap_node(btn)
            time.sleep(2)

            root=dump('/sdcard/picker.xml','emulator-test/picker.xml')
            file_node=find(root,'test.env',contains=True)
            if file_node is None:
                downloads=find(root,'Downloads')
                if downloads is None:
                    raise RuntimeError('Downloads entry not found in picker')
                tap_node(downloads)
                time.sleep(2)
                root=dump('/sdcard/picker2.xml','emulator-test/picker2.xml')
                file_node=find(root,'test.env',contains=True)
            if file_node is None:
                raise RuntimeError('test.env not found in picker')
            tap_node(file_node)
            PY

            sleep 5
            adb shell uiautomator dump /sdcard/window-after-env.xml >/dev/null
            adb pull /sdcard/window-after-env.xml emulator-test/window-after-env.xml >/dev/null
            adb exec-out screencap -p > emulator-test/after-env.png
            adb logcat -d > emulator-test/logcat.txt

            grep -Fq '.env yüklendi' emulator-test/window-after-env.xml

            if grep -Fq 'FATAL EXCEPTION' emulator-test/logcat.txt; then
              echo 'App crash detected'
              tail -n 250 emulator-test/logcat.txt
              exit 1
            fi

            echo 'EMULATOR_SMOKE_TEST_OK'

      - name: Upload emulator evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: earnings-emulator-test
          path: emulator-test/
          if-no-files-found: warn
          retention-days: 3
