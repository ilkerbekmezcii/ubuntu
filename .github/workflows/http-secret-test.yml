name: HTTP Secret Test

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Authenticated GitHub API request
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          START=$(date +%s%3N)
          CODE=$(curl -sS -o /tmp/resp.json -w '%{http_code}' \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            https://api.github.com/repos/ilkerbekmezcii/ubuntu)
          END=$(date +%s%3N)
          echo "HTTP_STATUS=${CODE}"
          echo "DURATION_MS=$((END-START))"
          python3 - <<'PY'
          import json
          d=json.load(open('/tmp/resp.json'))
          print('FULL_NAME='+str(d.get('full_name')))
          print('PRIVATE='+str(d.get('private')))
          PY
