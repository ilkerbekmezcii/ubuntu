name: Private Game Build

on:
  issues:
    types: [opened]

permissions:
  contents: read
  id-token: write
  issues: write

concurrency:
  group: game-build-${{ github.event.issue.number }}
  cancel-in-progress: false

jobs:
  build:
    if: github.event.issue.user.login == 'ilkerbekmezcii' && startsWith(github.event.issue.title, '[GAME BUILD]')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Parse validated build request
        id: request
        shell: bash
        env:
          ISSUE_BODY: ${{ github.event.issue.body }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import os, re
          body = os.environ.get('ISSUE_BODY', '')
          values = {}
          for raw in body.splitlines():
              m = re.fullmatch(r'\s*(repo|ref)\s*=\s*([A-Za-z0-9._-]+)\s*', raw)
              if m:
                  values[m.group(1)] = m.group(2)
          allowed_repos = {
              'Adam-Asmaca-Oyunu', 'AppleHunter', 'Blue-Cube-Oyunu',
              'BrainGames', 'CengelBulmaca', 'ChessGame', 'GameConsole',
              'forest_run'
          }
          if values.get('repo') not in allowed_repos:
              raise SystemExit('invalid repo')
          if values.get('ref') != 'work':
              raise SystemExit('invalid ref')
          with open(os.environ['GITHUB_OUTPUT'], 'a', encoding='utf-8') as f:
              f.write('repo=' + values['repo'] + '\n')
              f.write('ref=' + values['ref'] + '\n')
          PY

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Fetch private work tree through OIDC relay
        shell: bash
        env:
          SOURCE_URL: https://hiyduakdyfcpibwxrtan.supabase.co/functions/v1/game-build-source-v1
          SOURCE_AUD: game-build-source-v1
          TARGET_REPO: ${{ steps.request.outputs.repo }}
          TARGET_REF: ${{ steps.request.outputs.ref }}
        run: |
          set -euo pipefail
          TOKEN="$(python3 - <<'PY'
          import json, os, urllib.parse, urllib.request
          url = os.environ['ACTIONS_ID_TOKEN_REQUEST_URL'] + '&audience=' + urllib.parse.quote(os.environ['SOURCE_AUD'])
          req = urllib.request.Request(url, headers={'Authorization': 'bearer ' + os.environ['ACTIONS_ID_TOKEN_REQUEST_TOKEN']})
          with urllib.request.urlopen(req, timeout=30) as response:
              print(json.load(response)['value'])
          PY
          )"
          rm -rf /tmp/game-src /tmp/game-src.tar.gz
          mkdir -p /tmp/game-src
          HTTP_CODE="$(curl --silent --show-error --location \
            -H "Authorization: Bearer ${TOKEN}" \
            -w '%{http_code}' \
            "${SOURCE_URL}?repo=${TARGET_REPO}&ref=${TARGET_REF}" \
            -o /tmp/game-src.tar.gz)"
          echo "SOURCE_HTTP_STATUS=${HTTP_CODE}"
          if [ "$HTTP_CODE" != "200" ]; then
            echo "SOURCE_FETCH_FAILED"
            exit 1
          fi
          if [ ! -s /tmp/game-src.tar.gz ]; then
            echo "SOURCE_ARCHIVE_EMPTY"
            exit 1
          fi
          if gzip -t /tmp/game-src.tar.gz >/dev/null 2>&1; then
            echo "SOURCE_GZIP_OK=1"
          else
            echo "SOURCE_GZIP_OK=0"
            exit 1
          fi
          if tar -tzf /tmp/game-src.tar.gz >/dev/null 2>&1; then
            echo "SOURCE_TAR_OK=1"
          else
            echo "SOURCE_TAR_OK=0"
            exit 1
          fi
          tar -xzf /tmp/game-src.tar.gz --strip-components=1 -C /tmp/game-src
          if [ -f /tmp/game-src/gradlew ]; then
            echo "SOURCE_GRADLEW_PRESENT=1"
          else
            echo "SOURCE_GRADLEW_PRESENT=0"
          fi

      - name: Check bundled JavaScript syntax
        working-directory: /tmp/game-src
        shell: bash
        run: |
          set -euo pipefail
          COUNT=0
          for DIR in app/src/main/assets www; do
            [ -d "$DIR" ] || continue
            while IFS= read -r -d '' FILE; do
              if ! node --check "$FILE" >/dev/null 2>&1; then
                echo "JS_SYNTAX_ERROR"
                exit 1
              fi
              COUNT=$((COUNT + 1))
            done < <(find "$DIR" -type f -name '*.js' -print0)
          done
          echo "JS_SYNTAX_OK count=${COUNT}"

      - name: Build debug APK
        working-directory: /tmp/game-src
        shell: bash
        run: |
          set -euo pipefail
          if [ -f gradlew ]; then
            chmod +x gradlew
            ./gradlew clean assembleDebug --stacktrace --no-daemon
          else
            GRADLE_VERSION=8.11.1
            curl --fail --silent --show-error --location \
              "https://services.gradle.org/distributions/gradle-${GRADLE_VERSION}-bin.zip" \
              -o /tmp/gradle-bin.zip
            rm -rf "/tmp/gradle-${GRADLE_VERSION}"
            unzip -q /tmp/gradle-bin.zip -d /tmp
            "/tmp/gradle-${GRADLE_VERSION}/bin/gradle" clean assembleDebug --stacktrace --no-daemon
          fi
          APK="$(find . -type f -path '*/outputs/apk/debug/*.apk' -name '*.apk' | head -n 1)"
          test -n "$APK"
          echo "BUILD_OK repo=${{ steps.request.outputs.repo }} ref=${{ steps.request.outputs.ref }}"
          sha256sum "$APK" | sed 's#  .*#  app-debug.apk#'

      - name: Check generated inline JavaScript
        working-directory: /tmp/game-src
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/inline-js-check
          mkdir -p /tmp/inline-js-check
          COUNT="$(python3 - <<'PY'
          from pathlib import Path
          import re
          candidates = [Path('app/src/main/assets/index.html'), Path('www/index.html')]
          out = Path('/tmp/inline-js-check')
          count = 0
          for path in candidates:
              if not path.exists():
                  continue
              text = path.read_text(encoding='utf-8')
              scripts = re.findall(r'<script(?![^>]*\bsrc\s*=)[^>]*>(.*?)</script>', text, re.I | re.S)
              for script in scripts:
                  (out / f'inline-{count}.js').write_text(script, encoding='utf-8')
                  count += 1
          print(count)
          PY
          )"
          for FILE in /tmp/inline-js-check/*.js; do
            [ -e "$FILE" ] || continue
            if ! node --check "$FILE" >/dev/null 2>&1; then
              echo "INLINE_JS_SYNTAX_ERROR"
              exit 1
            fi
          done
          echo "INLINE_JS_SYNTAX_OK count=${COUNT}"

      - name: Remove private source from runner
        if: always()
        shell: bash
        run: rm -rf /tmp/game-src /tmp/game-src.tar.gz /tmp/gradle-bin.zip /tmp/gradle-8.11.1 /tmp/inline-js-check

      - name: Report result
        if: always()
        uses: actions/github-script@v8
        env:
          BUILD_STATUS: ${{ job.status }}
          TARGET_REPO: ${{ steps.request.outputs.repo }}
          TARGET_REF: ${{ steps.request.outputs.ref }}
        with:
          script: |
            const status = process.env.BUILD_STATUS;
            const repo = process.env.TARGET_REPO || 'unknown';
            const ref = process.env.TARGET_REF || 'unknown';
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: `GAME_BUILD_RESULT=${status} repo=${repo} ref=${ref}`
            });
