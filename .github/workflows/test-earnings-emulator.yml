name: Test Microsoft Earnings APK on Emulator

on:
  workflow_dispatch:
  push:
    branches: [work]
    paths:
      - 'android-earnings/**'
      - '.github/workflows/test-earnings-emulator.yml'

permissions:
  contents: read

jobs:
  emulator-smoke-test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Build APK
        working-directory: android-earnings
        shell: bash
        run: |
          set -euo pipefail
          gradle --no-daemon assembleDebug

      - name: Enable KVM
        shell: bash
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Emulator smoke test
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 30
          arch: x86_64
          profile: pixel_2
          disable-animations: true
          script: |
            set -euo pipefail
            APK=android-earnings/app/build/outputs/apk/debug/app-debug.apk
            PKG=com.ilker.microsoftreport
            ACT=.MainActivity

            adb wait-for-device
            adb install -r "$APK"
            adb logcat -c
            adb shell am force-stop "$PKG"
            adb shell am start -W -n "$PKG/$ACT"
            sleep 3

            mkdir -p emulator-test
            adb shell uiautomator dump /sdcard/window.xml >/dev/null
            adb pull /sdcard/window.xml emulator-test/window-initial.xml >/dev/null
            adb exec-out screencap -p > emulator-test/initial.png

            grep -q 'Microsoft Earnings' emulator-test/window-initial.xml
            grep -q 'Bugün' emulator-test/window-initial.xml
            grep -q 'Bu Ay' emulator-test/window-initial.xml
            grep -q '.env dosyası seç' emulator-test/window-initial.xml
            grep -q 'Microsoft ile giriş / MFA' emulator-test/window-initial.xml

            printf 'TENANT_ID=test-tenant\nCLIENT_ID=test-client\n' > emulator-test/test.env
            adb push emulator-test/test.env /sdcard/Download/test.env >/dev/null

            python3 - <<'PY'
            import re, subprocess, xml.etree.ElementTree as ET
            root=ET.parse('emulator-test/window-initial.xml').getroot()
            for n in root.iter('node'):
                if n.attrib.get('text') == '.env dosyası seç':
                    m=re.match(r'\[(\d+),(\d+)\]\[(\d+),(\d+)\]', n.attrib['bounds'])
                    x=(int(m.group(1))+int(m.group(3)))//2
                    y=(int(m.group(2))+int(m.group(4)))//2
                    subprocess.check_call(['adb','shell','input','tap',str(x),str(y)])
                    break
            else:
                raise SystemExit('ENV button not found')
            PY
            sleep 2

            adb shell uiautomator dump /sdcard/picker.xml >/dev/null
            adb pull /sdcard/picker.xml emulator-test/picker.xml >/dev/null
            adb exec-out screencap -p > emulator-test/picker.png

            python3 - <<'PY'
            import re, subprocess, xml.etree.ElementTree as ET
            root=ET.parse('emulator-test/picker.xml').getroot()
            candidates=[]
            for n in root.iter('node'):
                txt=n.attrib.get('text','')
                desc=n.attrib.get('content-desc','')
                if 'test.env' in txt or 'test.env' in desc:
                    candidates.append(n)
            if not candidates:
                # Open Downloads if the picker starts at Recents and the file is not visible.
                for n in root.iter('node'):
                    if n.attrib.get('text') == 'Downloads':
                        m=re.match(r'\[(\d+),(\d+)\]\[(\d+),(\d+)\]', n.attrib['bounds'])
                        x=(int(m.group(1))+int(m.group(3)))//2; y=(int(m.group(2))+int(m.group(4)))//2
                        subprocess.check_call(['adb','shell','input','tap',str(x),str(y)])
                        raise SystemExit(42)
                raise SystemExit('test.env not visible in picker')
            n=candidates[0]
            m=re.match(r'\[(\d+),(\d+)\]\[(\d+),(\d+)\]', n.attrib['bounds'])
            x=(int(m.group(1))+int(m.group(3)))//2; y=(int(m.group(2))+int(m.group(4)))//2
            subprocess.check_call(['adb','shell','input','tap',str(x),str(y)])
            PY
            rc=$?
            if [ "$rc" = 42 ]; then
              sleep 1
              adb shell uiautomator dump /sdcard/picker2.xml >/dev/null
              adb pull /sdcard/picker2.xml emulator-test/picker2.xml >/dev/null
              python3 - <<'PY'
            import re, subprocess, xml.etree.ElementTree as ET
            root=ET.parse('emulator-test/picker2.xml').getroot()
            for n in root.iter('node'):
                if 'test.env' in n.attrib.get('text','') or 'test.env' in n.attrib.get('content-desc',''):
                    m=re.match(r'\[(\d+),(\d+)\]\[(\d+),(\d+)\]', n.attrib['bounds'])
                    x=(int(m.group(1))+int(m.group(3)))//2; y=(int(m.group(2))+int(m.group(4)))//2
                    subprocess.check_call(['adb','shell','input','tap',str(x),str(y)])
                    break
            else:
                raise SystemExit('test.env not found in Downloads')
            PY
            fi

            sleep 4
            adb shell uiautomator dump /sdcard/window-after-env.xml >/dev/null || true
            adb pull /sdcard/window-after-env.xml emulator-test/window-after-env.xml >/dev/null || true
            adb exec-out screencap -p > emulator-test/after-env.png || true
            adb logcat -d > emulator-test/logcat.txt

            if grep -q 'FATAL EXCEPTION' emulator-test/logcat.txt; then
              echo 'App crash detected'
              tail -n 250 emulator-test/logcat.txt
              exit 1
            fi

            # Successful import must advance beyond the initial "Önce .env dosyasını seçin." state.
            if grep -q 'Önce .env dosyasını seçin.' emulator-test/window-after-env.xml; then
              echo '.env import did not advance setup state'
              exit 1
            fi

            echo 'EMULATOR_SMOKE_TEST_OK'

      - name: Upload emulator evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: earnings-emulator-test
          path: emulator-test/
          if-no-files-found: warn
          retention-days: 3
