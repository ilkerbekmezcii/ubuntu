name: Temporary Tiwoo Luna Handle Test

on:
  push:
    paths:
      - '.github/workflows/tiwoo-luna-handle-test.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout Tiwoo work branch temporarily
        uses: actions/checkout@v4
        with:
          repository: ilkerbekmezcii/tiwoo
          ref: work
          path: tiwoo
          persist-credentials: false

      - name: Validate Luna handle sources
        shell: bash
        run: |
          set -euo pipefail
          cd tiwoo
          node --check public/tiwoo-ai-mention.js
          npx --yes esbuild@0.25.9 supabase/functions/tiwoo-ai-mention/index.ts --loader:.ts=ts --format=esm --outfile=/tmp/mention.js >/dev/null
          npx --yes esbuild@0.25.9 supabase/functions/tiwoo-ai-dm/index.ts --loader:.ts=ts --format=esm --outfile=/tmp/dm.js >/dev/null
          npx --yes esbuild@0.25.9 supabase/functions/tiwoo-ai-dispatch/handler.ts --loader:.ts=ts --format=esm --outfile=/tmp/dispatch.js >/dev/null
          npx --yes esbuild@0.25.9 supabase/functions/tiwoo-push-dispatch/index.ts --loader:.ts=ts --format=esm --outfile=/tmp/autonomy.js >/dev/null
          grep -F "handle:'@luna'" public/tiwoo-ai-mention.js
          grep -F 'const BOT_HANDLE = "@luna"' supabase/functions/tiwoo-ai-mention/index.ts
          grep -F 'const BOT_HANDLES=new Set(["@luna","@kata","@tiwoo","@lina","@lina_ai"]);' supabase/functions/tiwoo-ai-dm/index.ts
          grep -F 'const BOT_HANDLES=["@luna","@lina"]' supabase/functions/tiwoo-push-dispatch/index.ts
          grep -F "set handle='@luna'" supabase/migrations/20260910191000_luna_canonical_handle.sql
          grep -F "('@luna','@kata','@tiwoo')" supabase/migrations/20260910191000_luna_canonical_handle.sql
          echo 'luna_handle_validation=pass'

      - name: Remove temporary checkout
        if: always()
        run: rm -rf tiwoo /tmp/mention.js /tmp/dm.js /tmp/dispatch.js /tmp/autonomy.js
