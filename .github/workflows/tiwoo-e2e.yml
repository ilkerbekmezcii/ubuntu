name: Tiwoo Live E2E Audit
on:
  push:
    branches: [tiwoo-e2e]
    paths: ['tiwoo-e2e.mjs','tiwoo-interactions.mjs','.github/workflows/tiwoo-e2e.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: tiwoo-live-e2e
  cancel-in-progress: true
jobs:
  audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Install Playwright Chromium
        run: |
          npm init -y >/dev/null 2>&1
          npm install --no-save playwright@1.55.0 >/dev/null
          npx playwright install --with-deps chromium >/dev/null
      - name: Audit live Tiwoo
        id: smoke
        continue-on-error: true
        run: node tiwoo-e2e.mjs
      - name: Prepare interaction audit
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('tiwoo-interactions.mjs'); s=p.read_text()
          s=s.replace("await setSession(primary);", "await setSession(primary); await rpc('privacy',{isPrivate:false});", 1)
          s=s.replace("s=bad.length;await page.locator('#followProfile').click();await sleep(1000);result.actions.unfollow=", "s=bad.length;await page.locator('#followProfile').click();await sleep(150);let uc=page.locator('#tiwooConfirmModal .tiwoo-confirm-approve');if(await uc.isVisible().catch(()=>false))await uc.click();await sleep(850);result.actions.unfollow=")
          old="await rpc('follow',{target:peerInfo.key});await setSession(peer);let pending=await page.evaluate(()=>social.incomingFollowRequests||[]);result.actions.followRequestVisible=pending.length; if(pending.length){let target=pending[0].key||pending[0].requesterKey||pending[0].userKey; if(target)result.actions.followRequestAccept=await rpc('follow_request',{target,decision:'accept'})}"
          new="await rpc('privacy',{isPrivate:true});await setSession(peer);const primaryInfo=await page.evaluate(username=>(social.directory||[]).find(x=>String(x.handle||'').toLowerCase()===('@'+String(username).toLowerCase())),primary.username);let fr=primaryInfo?await rpc('follow',{target:primaryInfo.key}):{error:'primary_not_found'};await setSession(primary);let pending=await page.evaluate(()=>social.incomingFollowRequests||[]);result.actions.followRequestVisible=pending.length;result.actions.followRequestCreate=fr;if(pending.length){let target=pending[0].key||pending[0].requesterKey||pending[0].userKey;if(target)result.actions.followRequestAccept=await rpc('follow_request',{target,decision:'accept'})}"
          s=s.replace(old,new)
          old="await setSession(primary);await page.evaluate(k=>go('profile',{profile:k}),peerInfo.key);await sleep(400);let mb=page.locator('#msgProfile');await mb.click();await sleep(700);let dm=page.locator('#dmText');if(await dm.count()){let mt=`dm-e2e-${Date.now()}`;await dm.fill(mt);s=bad.length;await page.locator('#dmSend').click();await sleep(1000);result.actions.message={toast:await toast(),bad:bad.slice(s)}}else result.actions.message={missing:true};"
          new="await setSession(primary);await page.evaluate(k=>go('profile',{profile:k}),peerInfo.key);await sleep(500);let mb=page.locator('#msgProfile');await mb.click();await sleep(1200);let dm=page.locator('[data-chat-input],#dmText').first();if(!await dm.count()){let row=page.locator('[data-chat-user]').filter({hasText:peer.username}).first();if(!await row.count())row=page.locator('[data-chat-user]').first();if(await row.count()){await row.click();await sleep(700);dm=page.locator('[data-chat-input],#dmText').first()}}if(await dm.count()){let mt=`dm-e2e-${Date.now()}`;await dm.fill(mt);s=bad.length;await page.locator('[data-chat-send],#dmSend').first().click();await sleep(1200);let persisted=await page.locator('.tiwoo-chat-bubble').filter({hasText:mt}).count();result.actions.message={visible:persisted,bad:bad.slice(s)}}else result.actions.message={missing:true};"
          s=s.replace(old,new)
          old="page.once('dialog',d=>d.accept());s=bad.length;await del.click();await sleep(1000);result.actions.delete={remaining:await page.locator(`[data-post=\"${id}\"]`).count(),toast:await toast(),bad:bad.slice(s)}"
          new="page.once('dialog',d=>d.accept());s=bad.length;await del.click();await sleep(150);let dc=page.locator('#tiwooConfirmModal .tiwoo-confirm-approve');if(await dc.isVisible().catch(()=>false))await dc.click();await sleep(1000);result.actions.delete={remaining:await page.locator(`[data-post=\"${id}\"]`).count(),toast:await toast(),bad:bad.slice(s)}"
          s=s.replace(old,new)
          s=s.replace("for(const [k,v] of Object.entries(result.actions)){if(v?.bad?.length||v?.missing)result.issues.push(`${k}:${JSON.stringify(v)}`)}", "for(const [k,v] of Object.entries(result.actions)){if(v?.bad?.length||v?.missing||k==='followRequestVisible'&&Number(v)<1||k==='delete'&&Number(v?.remaining)>0||k==='message'&&Number(v?.visible)<1)result.issues.push(`${k}:${JSON.stringify(v)}`)}")
          p.write_text(s)
          PY
      - name: Audit Tiwoo interactions
        id: interactions
        continue-on-error: true
        run: node tiwoo-interactions.mjs
      - name: Upload public audit evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tiwoo-live-audit
          path: artifacts/
          if-no-files-found: warn
          retention-days: 1
      - name: Fail on audit errors
        if: always()
        run: |
          if [ "${{ steps.smoke.outcome }}" != "success" ] || [ "${{ steps.interactions.outcome }}" != "success" ]; then exit 1; fi
