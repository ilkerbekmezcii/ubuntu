name: Tiwoo Signed-In Recovery Check Temp

on:
  push:
    branches: [main]
    paths: ['.github/workflows/tiwoo-signedin-recovery-check-temp.yml']
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Fetch private Tiwoo recovery runtime to ephemeral disk
        shell: bash
        env:
          PAYLOAD_URL: https://hiyduakdyfcpibwxrtan.supabase.co/functions/v1/tiwoo-work-check-payload
          PAYLOAD_AUD: tiwoo-work-check-v1
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, os, pathlib, urllib.parse, urllib.request
          base=os.environ['PAYLOAD_URL']
          aud=os.environ['PAYLOAD_AUD']
          oidc=os.environ['ACTIONS_ID_TOKEN_REQUEST_URL']+'&audience='+urllib.parse.quote(aud)
          req=urllib.request.Request(oidc,headers={'Authorization':'bearer '+os.environ['ACTIONS_ID_TOKEN_REQUEST_TOKEN']})
          with urllib.request.urlopen(req,timeout=30) as r:
              token=json.load(r)['value']
          url=base+'?file='+urllib.parse.quote('public/recovery-ui.js')
          req=urllib.request.Request(url,headers={'Authorization':'Bearer '+token})
          with urllib.request.urlopen(req,timeout=60) as r:data=r.read()
          root=pathlib.Path('/tmp/tiwoo-signedin-recovery')
          root.mkdir(parents=True,exist_ok=True)
          (root/'recovery-ui.js').write_bytes(data)
          PY

      - name: Validate signed-in and logged-out recovery paths
        working-directory: /tmp/tiwoo-signedin-recovery
        shell: bash
        run: |
          set -euo pipefail
          node --check recovery-ui.js
          node <<'NODE'
          const fs=require('fs');
          const s=fs.readFileSync('recovery-ui.js','utf8');
          const need=(ok,msg)=>{if(!ok)throw new Error(msg)};
          need(s.includes('function signedInApp()'),'signed-in app detection missing');
          need(s.includes('sessionOnly=signedInApp();authenticated=sessionOnly'),'signed-in mode is not selected before first draw');
          need(s.includes("classList.toggle('hidden',sessionOnly||authenticated||step===1)"),'username field is not hidden immediately for signed-in reset');
          need(s.includes('if(sessionOnly||authenticated)return{}'),'signed-in reset still sends a username identity');
          need(s.includes('if(sessionOnly)return authenticated'),'signed-in reset can send before session verification');
          need(s.includes('if(sessionOnly&&!authenticated)'),'signed-in session failure guard missing');
          need(s.includes("return{method:'username',username}"),'logged-out username recovery was removed');
          need(s.includes('Geçerli bir kullanıcı adı yazın.'),'logged-out recovery validation was removed');
          console.log('SIGNED_IN_RECOVERY_CHECK=PASS');
          NODE

      - name: Remove private file
        if: always()
        run: rm -rf /tmp/tiwoo-signedin-recovery
