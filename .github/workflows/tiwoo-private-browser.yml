name: Tiwoo Private Browser Regression

on:
  issues:
    types: [opened]

permissions:
  contents: read
  id-token: write
  issues: write

jobs:
  browser:
    if: github.event.issue.user.login == 'ilkerbekmezcii' && startsWith(github.event.issue.title, '[TIWOO PRIVATE BROWSER]')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Fetch private Tiwoo work tree through OIDC relay
        shell: bash
        env:
          SOURCE_URL: https://hiyduakdyfcpibwxrtan.supabase.co/functions/v1/tiwoo-test-source-v1
          SOURCE_AUD: tiwoo-test-source-v1
        run: |
          set -euo pipefail
          TOKEN="$(python3 - <<'PY'
          import json, os, urllib.parse, urllib.request
          url = os.environ['ACTIONS_ID_TOKEN_REQUEST_URL'] + '&audience=' + urllib.parse.quote(os.environ['SOURCE_AUD'])
          req = urllib.request.Request(url, headers={'Authorization': 'bearer ' + os.environ['ACTIONS_ID_TOKEN_REQUEST_TOKEN']})
          with urllib.request.urlopen(req, timeout=30) as response: print(json.load(response)['value'])
          PY
          )"
          rm -rf /tmp/tiwoo-src /tmp/tiwoo-browser /tmp/tiwoo-src.tar.gz /tmp/tiwoo-source-meta.txt
          mkdir -p /tmp/tiwoo-src /tmp/tiwoo-browser
          code="$(curl --silent --show-error --location -H "Authorization: Bearer ${TOKEN}" -w '%{http_code}' "${SOURCE_URL}" -o /tmp/tiwoo-src.tar.gz)"
          test "$code" = "200"
          tar -xzf /tmp/tiwoo-src.tar.gz --strip-components=1 -C /tmp/tiwoo-src
          test -f /tmp/tiwoo-src/public/index.html
          if grep -q "tiwooForgotBound" /tmp/tiwoo-src/public/auth-login-redesign.js; then marker=true; else marker=false; fi
          printf 'reliableMarker=%s\nauthLoginSha256=%s\n' "$marker" "$(sha256sum /tmp/tiwoo-src/public/auth-login-redesign.js | awk '{print $1}')" | tee /tmp/tiwoo-source-meta.txt

      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install Chromium
        working-directory: /tmp/tiwoo-browser
        run: |
          npm init -y >/dev/null
          npm install --no-audit --no-fund playwright@1.55.0
          npx playwright install --with-deps chromium

      - name: Run forgot-password browser regression
        working-directory: /tmp/tiwoo-browser
        shell: bash
        run: |
          set -euo pipefail
          python3 -m http.server 8765 --directory /tmp/tiwoo-src/public >/tmp/tiwoo-http.log 2>&1 &
          SERVER_PID=$!
          trap 'kill $SERVER_PID 2>/dev/null || true' EXIT
          for i in {1..20}; do curl -fsS http://127.0.0.1:8765/ >/dev/null && break; sleep .25; done
          cat > regression.mjs <<'JS'
          import { chromium } from 'playwright';
          import fs from 'node:fs';
          const browser=await chromium.launch({headless:true});
          const page=await browser.newPage({viewport:{width:1280,height:900}});
          page.setDefaultTimeout(8000);
          const errors=[]; page.on('pageerror',e=>errors.push(String(e)));
          await page.goto('http://127.0.0.1:8765/',{waitUntil:'domcontentloaded'});
          await page.waitForTimeout(2000);
          await page.locator('#publicLogin').click();
          await page.locator('#shellForgot').waitFor({state:'visible'});
          const bound=await page.locator('#shellForgot').getAttribute('data-tiwoo-forgot-bound');
          await page.locator('#shellForgot').click();
          await page.waitForTimeout(250);
          const authClass=await page.locator('#authModal').getAttribute('class');
          const forgotClass=await page.locator('#forgotModal').getAttribute('class');
          const result={bound,authClass,forgotClass,authVisible:await page.locator('#authModal').isVisible(),forgotVisible:await page.locator('#forgotModal').isVisible(),emailVisible:await page.locator('#forgotEmail').isVisible(),emailFocused:await page.locator('#forgotEmail').evaluate(el=>document.activeElement===el),pageErrors:errors};
          fs.writeFileSync('result.json',JSON.stringify(result,null,2));
          console.log(JSON.stringify(result,null,2));
          await browser.close();
          if(bound!=='1'||result.authVisible||!result.forgotVisible||!result.emailVisible||!result.emailFocused||result.pageErrors.length)process.exit(1);
          JS
          node regression.mjs

      - name: Report result
        if: always()
        uses: actions/github-script@v8
        with:
          script: |
            const fs=require('fs');
            let result='unavailable',meta='unavailable';
            try{result=fs.readFileSync('/tmp/tiwoo-browser/result.json','utf8')}catch{}
            try{meta=fs.readFileSync('/tmp/tiwoo-source-meta.txt','utf8').trim()}catch{}
            await github.rest.issues.createComment({owner:context.repo.owner,repo:context.repo.repo,issue_number:context.issue.number,body:`TIWOO_PRIVATE_BROWSER_RESULT\n${meta}\n\`\`\`json\n${result}\n\`\`\``});

      - name: Cleanup
        if: always()
        run: rm -rf /tmp/tiwoo-src /tmp/tiwoo-browser /tmp/tiwoo-src.tar.gz /tmp/tiwoo-http.log /tmp/tiwoo-source-meta.txt
