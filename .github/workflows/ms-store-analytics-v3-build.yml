name: Build Microsoft Store Analytics v3

on:
  push:
    branches: [ms-store-analytics-v3-build]
    paths:
      - 'microsoft-store-analytics-v3/**'
      - '.github/workflows/ms-store-analytics-v3-build.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - name: Build debug APK
        shell: bash
        working-directory: microsoft-store-analytics-v3
        run: |
          set -euo pipefail
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager 'platforms;android-36' 'build-tools;36.0.0' >/dev/null
          curl -fsSL -o /tmp/gradle.zip https://services.gradle.org/distributions/gradle-8.11.1-bin.zip
          unzip -q /tmp/gradle.zip -d /tmp
          /tmp/gradle-8.11.1/bin/gradle --no-daemon :app:assembleDebug
          cp app/build/outputs/apk/debug/app-debug.apk ../Microsoft-Store-Analytics-v3-debug.apk
          sha256sum ../Microsoft-Store-Analytics-v3-debug.apk
      - name: Package apksigner only
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/apksigner-tool/lib
          cp "$ANDROID_HOME/build-tools/36.0.0/apksigner" /tmp/apksigner-tool/apksigner
          cp "$ANDROID_HOME/build-tools/36.0.0/lib/apksigner.jar" /tmp/apksigner-tool/lib/apksigner.jar
          tar -C /tmp -czf android-apksigner-36.tgz apksigner-tool
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Microsoft-Store-Analytics-v3-debug
          path: Microsoft-Store-Analytics-v3-debug.apk
          if-no-files-found: error
      - name: Upload apksigner tool
        uses: actions/upload-artifact@v4
        with:
          name: android-apksigner-36
          path: android-apksigner-36.tgz
          if-no-files-found: error
