name: Partner Center Earnings via Azure CLI User Token

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/partner-center-earnings-live.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  earnings:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      PARTNER_CENTER_TENANT_ID: ${{ secrets.PARTNER_CENTER_TENANT_ID }}
      TZ: Europe/Istanbul
    steps:
      - name: Sign in interactively with device code
        shell: bash
        run: |
          set -euo pipefail
          az login --tenant "$PARTNER_CENTER_TENANT_ID" --use-device-code --allow-no-subscriptions >/tmp/az-login.json
          echo "azure_user_login=success"

      - name: Get Partner Center user token
        shell: bash
        run: |
          set -euo pipefail
          TOKEN=$(az account get-access-token --resource https://api.partner.microsoft.com --query accessToken -o tsv)
          test -n "$TOKEN"
          echo "::add-mask::$TOKEN"
          printf '%s' "$TOKEN" > "$RUNNER_TEMP/partner_user_token"
          PAYLOAD=$(printf '%s' "$TOKEN" | cut -d. -f2 | tr '_-' '/+' | awk '{l=length($0)%4;if(l==2)$0=$0"==";else if(l==3)$0=$0"=";print}' | base64 -d 2>/dev/null || true)
          echo "token_aud=$(printf '%s' "$PAYLOAD" | jq -r '.aud // empty')"
          echo "token_has_upn=$(printf '%s' "$PAYLOAD" | jq 'has("upn") or has("preferred_username")')"
          echo "token_has_oid=$(printf '%s' "$PAYLOAD" | jq 'has("oid")')"

      - name: Call Earnings API
        shell: bash
        run: |
          set -euo pipefail
          TOKEN=$(cat "$RUNNER_TEMP/partner_user_token")
          TODAY=$(TZ=Europe/Istanbul date +%F)
          FILTER="earningForDate ge ${TODAY} and earningForDate le ${TODAY}"
          BODY=$(mktemp)
          HEADERS=$(mktemp)
          METRICS=$(curl -sS -D "$HEADERS" -o "$BODY" -w '%{http_code} %{time_total}' \
            -X POST \
            -G 'https://api.partner.microsoft.com/v1.0/payouts/transactionhistory' \
            --data-urlencode "\$filter=${FILTER}" \
            --data-urlencode 'fileformat=csv' \
            -H "Authorization: Bearer ${TOKEN}" \
            -H 'Accept: application/json' \
            -H 'Content-Length: 0')
          CODE=$(awk '{print $1}' <<<"$METRICS")
          TIME=$(awk '{print $2}' <<<"$METRICS")
          echo "date=$TODAY"
          echo "earnings_http_status=$CODE"
          echo "earnings_seconds=$TIME"
          echo 'response_headers_begin'
          grep -Ei '^(HTTP/|request-id:|location:|content-type:|retry-after:)' "$HEADERS" || true
          echo 'response_headers_end'
          echo 'response_body_begin'
          cat "$BODY"
          echo
          echo 'response_body_end'
