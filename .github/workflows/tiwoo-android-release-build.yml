name: Tiwoo Android Release Build

on:
  issues:
    types: [opened]

permissions:
  contents: read
  id-token: write
  issues: write

concurrency:
  group: tiwoo-android-release
  cancel-in-progress: false

jobs:
  build:
    if: github.event.issue.user.login == 'ilkerbekmezcii' && github.event.issue.title == '[TIWOO ANDROID BUILD 1.1.3]'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Fetch private Tiwoo Android source via GitHub OIDC
        shell: bash
        env:
          PAYLOAD_URL: https://hiyduakdyfcpibwxrtan.supabase.co/functions/v1/tiwoo-runner-source-once
          PAYLOAD_AUD: tiwoo-android-build-v1
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, os, pathlib, urllib.parse, urllib.request, urllib.error
          oidc=os.environ['ACTIONS_ID_TOKEN_REQUEST_URL']+'&audience='+urllib.parse.quote(os.environ['PAYLOAD_AUD'])
          req=urllib.request.Request(oidc,headers={'Authorization':'bearer '+os.environ['ACTIONS_ID_TOKEN_REQUEST_TOKEN']})
          with urllib.request.urlopen(req,timeout=30) as r:
              token=json.load(r)['value']
          base=os.environ['PAYLOAD_URL']
          def get(name):
              req=urllib.request.Request(base+'?file='+urllib.parse.quote(name),headers={'Authorization':'Bearer '+token})
              try:
                  with urllib.request.urlopen(req,timeout=60) as r:return r.read()
              except urllib.error.HTTPError as e:
                  body=e.read().decode('utf-8','replace')[:1000]
                  raise RuntimeError(f'payload_http_{e.code}: {body}') from None
          manifest=json.loads(get('manifest'))
          files=manifest['files']
          root=pathlib.Path('/tmp/tiwoo')
          for name in files:
              dest=root/name
              dest.parent.mkdir(parents=True,exist_ok=True)
              dest.write_bytes(get(name))
          print('ANDROID_SOURCE_FILES='+str(len(files)))
          PY

      - name: Install Gradle 8.11.1
        shell: bash
        run: |
          set -euo pipefail
          curl -fL --retry 5 --retry-delay 2 -o /tmp/gradle.zip https://services.gradle.org/distributions/gradle-8.11.1-bin.zip
          unzip -q /tmp/gradle.zip -d /tmp
          echo '/tmp/gradle-8.11.1/bin' >> "$GITHUB_PATH"

      - name: Ensure Android SDK 36
        shell: bash
        run: |
          set -euo pipefail
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager 'platform-tools' 'platforms;android-36' 'build-tools;36.0.0'

      - name: Build full Firebase release APK and AAB
        working-directory: /tmp/tiwoo/android
        shell: bash
        run: |
          set -euo pipefail
          gradle --no-daemon --stacktrace assembleRelease bundleRelease
          test -s app/build/outputs/apk/release/app-release-unsigned.apk
          test -s app/build/outputs/bundle/release/app-release.aab
          sha256sum app/build/outputs/apk/release/app-release-unsigned.apk app/build/outputs/bundle/release/app-release.aab

      - name: Stage artifacts
        shell: bash
        run: |
          mkdir -p /tmp/out
          cp /tmp/tiwoo/android/app/build/outputs/apk/release/app-release-unsigned.apk /tmp/out/Tiwoo-1.1.3-full-unsigned.apk
          cp /tmp/tiwoo/android/app/build/outputs/bundle/release/app-release.aab /tmp/out/Tiwoo-1.1.3-full-unsigned.aab

      - name: Upload unsigned build
        uses: actions/upload-artifact@v4
        with:
          name: tiwoo-1.1.3-full-unsigned
          path: /tmp/out/*
          if-no-files-found: error
          retention-days: 1

      - name: Report result
        if: always()
        uses: actions/github-script@v8
        with:
          script: |
            await github.rest.issues.createComment({owner:context.repo.owner,repo:context.repo.repo,issue_number:context.issue.number,body:`TIWOO_ANDROID_BUILD=${context.job} / ${context.runId}`});

      - name: Cleanup private source
        if: always()
        shell: bash
        run: rm -rf /tmp/tiwoo /tmp/out /tmp/gradle.zip /tmp/gradle-8.11.1
